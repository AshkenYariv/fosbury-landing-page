<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fosbury</title>
<meta name="description" content="Resolve every conversation your team runs on, without ever being online at the same time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;510;600;620;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 150'%3E%3Cg fill='none' stroke='%23201C18' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M79 27 C75 15 61 10 53 18 C46 25 45 36 45 48 C45 72 43 93 41 110 C39 126 33 139 22 137 C12 135 11 121 26 112 C43 102 66 93 86 80'/%3E%3Cpath d='M6 108 H104'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   Tokens.

   The block below is the product's own `styles/tokens.css`, light theme only,
   trimmed to what this page draws. The mock is the app, so it is painted with
   the app's values rather than with approximations of them.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --font-family-app:'Inter',system-ui,-apple-system,sans-serif;
  --font-family-code:ui-monospace,'SF Mono',Menlo,monospace;
  --text-size-mini:10px;
  --text-size-micro:11px;
  --text-size-small:12px;
  --text-size-regular:13px;
  --text-size-medium:14px;
  --text-size-large:15px;
  --text-weight-regular:400;
  --text-weight-medium:500;
  --text-weight-heading:510;
  --text-weight-bold:620;
  --line-height-tight:1.3;
  --line-height-ui:1.45;
  --line-height-reading:1.65;

  --surface-chrome:#f4f4f5;
  --surface-canvas:#ffffff;
  --surface-raised:#ffffff;
  --surface-subtle:rgb(0 0 0 / .035);
  --surface-hover:rgb(0 0 0 / .045);
  --surface-hover-strong:rgb(0 0 0 / .09);
  --surface-selected:rgb(0 0 0 / .068);
  --surface-sunken:rgb(0 0 0 / .055);
  --surface-scrim:rgb(20 20 22 / .28);
  --surface-code:rgb(0 0 0 / .025);

  --border-subtle:rgb(0 0 0 / .07);
  --border-strong:rgb(0 0 0 / .12);

  --text-primary:#282a30;
  --text-secondary:#4b4e55;
  --text-tertiary:#8a8f98;
  --text-quaternary:#a8abb2;

  --icon-default:#6b6f76;
  --icon-tertiary:#8a8f98;

  --accent:#5e6ad2;
  --focus-ring:rgb(94 106 210 / .55);

  --success:#4cb782;
  --danger:#eb5757;

  --status-open:#8a8f98;
  --status-resolved:#3a8f68;
  --status-closed:#a4abb3;

  --priority-urgent:#e07b3c;

  --identity-gray:#6b7280;
  --identity-purple:#6a5bd0;
  --identity-blue:#3b7ad4;
  --identity-teal:#1c8c96;
  --identity-green:#2f8b62;
  --identity-yellow:#a3781f;
  --identity-orange:#bd6c39;
  --identity-red:#c2524f;
  --identity-pink:#bb5589;
  --identity-wash:12%;

  --unread:#5f95e4;
  --unread-wash:14%;
  --favorite:#e2a03f;

  --reaction-acknowledged:var(--identity-teal);
  --reaction-agree:var(--identity-green);
  --reaction-disagree:var(--identity-red);
  --reaction-done:var(--status-resolved);
  --reaction-question:var(--identity-purple);
  --reaction-thanks:var(--identity-yellow);

  --topic-type-dev:#a3781f;
  --topic-type-ask:#0f8a97;
  --topic-type-general:#6b7280;
  --topic-type-sync:#b8508c;
  --topic-type-broadcast:#5b53cf;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:48px;

  --radius-small:4px; --radius-medium:6px; --radius-large:8px;
  --radius-canvas:10px; --radius-pill:999px;

  --row-height-compact:28px;
  --row-height-default:32px;
  --row-height-issue:36px;
  --row-height-table:40px;
  --icon-size-compact:12px;
  --icon-size-default:14px;
  --icon-size-prominent:16px;

  --sidebar-width:244px;
  --utilitybar-height:34px;
  --chrome-gap:8px;
  --duration-panel:180ms;
  --ease-panel:cubic-bezier(.32,.72,0,1);

  --shadow-canvas:0 0 0 1px rgb(0 0 0 / .055), 0 1px 2px rgb(0 0 0 / .04);
  --shadow-menu:0 0 0 1px rgb(0 0 0 / .06), 0 12px 32px -12px rgb(0 0 0 / .32);
  --shadow-modal:0 0 0 1px rgb(0 0 0 / .06), 0 24px 60px -20px rgb(0 0 0 / .34);
}

/* Domain value → token. Copied from the product: nothing below names a colour. */
[data-identity-color='gray']{--identity:var(--identity-gray)}
[data-identity-color='purple']{--identity:var(--identity-purple)}
[data-identity-color='blue']{--identity:var(--identity-blue)}
[data-identity-color='teal']{--identity:var(--identity-teal)}
[data-identity-color='green']{--identity:var(--identity-green)}
[data-identity-color='yellow']{--identity:var(--identity-yellow)}
[data-identity-color='orange']{--identity:var(--identity-orange)}
[data-identity-color='red']{--identity:var(--identity-red)}
[data-identity-color='pink']{--identity:var(--identity-pink)}

[data-status='open']{--status:var(--status-open)}
[data-status='resolved']{--status:var(--status-resolved)}
[data-status='closed']{--status:var(--status-closed)}

[data-reaction='acknowledged']{--reaction:var(--reaction-acknowledged)}
[data-reaction='agree']{--reaction:var(--reaction-agree)}
[data-reaction='disagree']{--reaction:var(--reaction-disagree)}
[data-reaction='done']{--reaction:var(--reaction-done)}
[data-reaction='question']{--reaction:var(--reaction-question)}
[data-reaction='thanks']{--reaction:var(--reaction-thanks)}

[data-topic-type='dev']{--topic-type:var(--topic-type-dev)}
[data-topic-type='ask']{--topic-type:var(--topic-type-ask)}
[data-topic-type='general']{--topic-type:var(--topic-type-general)}
[data-topic-type='sync']{--topic-type:var(--topic-type-sync)}
[data-topic-type='broadcast']{--topic-type:var(--topic-type-broadcast)}

/* ══════════════════════════════════════════════════════════════════════════
   The page.
   ══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  /* Plain white, as the ticket asks. The chrome grey belongs to the app, not the page. */
  background:#fff;
  color:var(--text-primary);
  font-family:var(--font-family-app);
  font-size:var(--text-size-regular);
  line-height:var(--line-height-ui);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
svg{display:block}
button{appearance:none;border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,p{margin:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:var(--radius-small)}

.page{
  height:100dvh;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  /* One gutter for the whole page, so the mark, the sentence and the frame share an edge. */
  --gut:clamp(20px,3.2vw,48px);
  padding:clamp(16px,2.4vh,26px) var(--gut) clamp(18px,3vh,38px);
  /* The frame grows to fill this row, so the bar above it needs a gap of its
     own or the two end up sharing an edge. */
  row-gap:clamp(12px,2.2vh,26px);
  overflow:hidden;
}

/* ── top bar ─────────────────────────────────────────────────────────────── */
.top{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:var(--space-4);
  flex:none;
}
.brand{display:inline-flex;align-items:center;gap:10px;justify-self:start}
.mark{height:clamp(24px,2.6vw,30px);width:auto;color:var(--text-primary);overflow:visible}
.wordmark{
  font-size:clamp(19px,2vw,23px);
  font-weight:700;
  letter-spacing:-.035em;
  line-height:1;
  color:var(--text-primary);
  opacity:0;
  animation:rise .7s 1.05s cubic-bezier(.2,.7,.2,1) forwards;
}
.nav{display:flex;align-items:center;gap:var(--space-2);justify-self:center}
.navLink{
  display:inline-flex;align-items:center;
  height:36px;padding:0 var(--space-4);
  border-radius:var(--radius-pill);
  color:var(--text-secondary);
  font-size:clamp(14px,1.1vw,15px);
  font-weight:var(--text-weight-medium);
}
.navLink:hover{background:var(--surface-hover);color:var(--text-primary)}
.openApp{
  justify-self:end;
  display:inline-flex;align-items:center;
  height:40px;padding:0 var(--space-5);
  border-radius:var(--radius-pill);
  background:var(--text-primary);
  color:#fff;
  font-size:clamp(14px,1.1vw,15px);
  font-weight:var(--text-weight-medium);
  letter-spacing:-.005em;
  transition:background .16s ease;
}
.openApp:hover{background:#3d4048}
.top .nav,.top .openApp{opacity:0;animation:rise .7s 1.15s cubic-bezier(.2,.7,.2,1) forwards}

/* ── the two halves ──────────────────────────────────────────────────────── */
.hero{
  display:grid;
  grid-template-columns:minmax(280px,0.78fr) minmax(0,1.7fr);
  align-items:center;
  gap:clamp(22px,2.6vw,40px);
  min-height:0;
}
.copy{
  min-width:0;
  opacity:0;
  animation:rise .8s 1.25s cubic-bezier(.2,.7,.2,1) forwards;
}
/* A single sentence. Nothing above it, nothing under it. */
.headline{
  font-size:clamp(28px,2.9vw,46px);
  font-weight:600;
  letter-spacing:-.035em;
  line-height:1.06;
  color:var(--text-primary);
  text-wrap:balance;
}

/* ── the frame ───────────────────────────────────────────────────────────── */
/*
 * The painting is a mount, not a backdrop: it sits close around the window
 * rather than spreading behind it, so the app stays the subject.
 */
.art{
  position:relative;
  display:grid;
  place-items:center;
  align-self:center;
  justify-self:center;
  min-width:0;min-height:0;
  padding:clamp(12px,1.5vw,26px);
  border-radius:clamp(16px,1.6vw,26px);
  background:#8fb3c9 url('assets/wheatfield-with-cypresses.jpg') center/cover no-repeat;
  box-shadow:0 1px 2px rgb(0 0 0 / .06), 0 24px 60px -28px rgb(0 0 0 / .38);
  overflow:hidden;
  opacity:0;
  animation:rise .9s 1.35s cubic-bezier(.2,.7,.2,1) forwards;
}
/* The scaler is the window's footprint *after* scaling; the window itself is
   drawn once at a fixed size and scaled from its top-left corner into it. So a
   13px row stays a 13px row in the same proportion at every viewport, and the
   frame never has to reflow the app to fit it. */
.artScaler{position:relative}

/* ══════════════════════════════════════════════════════════════════════════
   The app, in a window.
   ══════════════════════════════════════════════════════════════════════════ */
.win{
  position:absolute;
  top:0;left:0;
  width:var(--win-w,1120px);
  height:var(--win-h,760px);
  transform:scale(var(--k,1));
  transform-origin:top left;
  display:flex;
  flex-direction:column;
  border-radius:12px;
  background:var(--surface-chrome);
  box-shadow:0 0 0 1px rgb(0 0 0 / .1), 0 30px 60px -20px rgb(0 0 0 / .45);
  overflow:hidden;
  font-size:var(--text-size-regular);
  color:var(--text-secondary);
  line-height:var(--line-height-ui);
}
.winBar{
  display:flex;align-items:center;gap:var(--space-3);
  flex:none;height:38px;padding:0 var(--space-3);
}
.lights{display:inline-flex;align-items:center;gap:8px;flex:none}
.light{width:12px;height:12px;border-radius:var(--radius-pill)}
.light[data-l='r']{background:#ff5f57}
.light[data-l='y']{background:#febc2e}
.light[data-l='g']{background:#28c840}
.winTab{
  display:inline-flex;align-items:center;gap:var(--space-2);
  width:200px;height:var(--row-height-compact);
  padding:0 var(--space-2);
  border-radius:var(--radius-medium);
  background:var(--surface-canvas);
  box-shadow:var(--shadow-canvas);
  color:var(--text-primary);
  font-size:var(--text-size-small);
  font-weight:var(--text-weight-medium);
  min-width:0;
}
.winBody{
  display:grid;
  grid-template-columns:var(--sidebar-width) minmax(0,1fr);
  flex:1;min-height:0;
}
.win[data-compact] .winBody{grid-template-columns:minmax(0,1fr)}
.win[data-compact] .side{display:none}
.canvas{
  display:flex;flex-direction:column;
  min-width:0;min-height:0;
  margin-right:var(--space-2);
  border-radius:var(--radius-canvas);
  background:var(--surface-canvas);
  box-shadow:var(--shadow-canvas);
  overflow:hidden;
}
.utilityBar{
  display:flex;align-items:center;justify-content:flex-end;
  flex:none;height:var(--utilitybar-height);padding:0 var(--space-3);
  gap:var(--space-1);
}
.utilityChip{
  display:inline-flex;align-items:center;gap:var(--space-2);
  height:var(--row-height-compact);padding:0 var(--space-2);
  border-radius:var(--radius-medium);
  color:var(--text-tertiary);font-size:var(--text-size-small);white-space:nowrap;
}
.utilityChip:hover{background:var(--surface-hover);color:var(--text-primary)}

/* ── sidebar ─────────────────────────────────────────────────────────────── */
.side{
  display:flex;flex-direction:column;gap:var(--space-1);
  min-height:0;padding:0 var(--space-2) var(--space-2);
}
.sideHeader{display:flex;align-items:center;gap:var(--space-1);flex:none;height:var(--row-height-default)}
.workspace{
  display:flex;align-items:center;gap:var(--space-2);flex:1;
  height:var(--row-height-default);padding:0 var(--space-2) 0 var(--space-1);
  border-radius:var(--radius-medium);
  color:var(--text-primary);font-weight:var(--text-weight-medium);min-width:0;
}
.workspace:hover{background:var(--surface-hover)}
.workspaceName{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconBtn{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:var(--row-height-compact);height:var(--row-height-compact);
  border-radius:var(--radius-medium);color:var(--icon-default);
}
.iconBtn:hover{background:var(--surface-hover);color:var(--text-primary)}
.sideScroll{
  display:flex;flex-direction:column;gap:var(--space-5);
  flex:1;min-height:0;overflow:hidden;
  padding-top:var(--space-3);padding-bottom:var(--space-4);
}
.sideGroup{display:flex;flex-direction:column}
.sideLabel{
  display:flex;align-items:center;gap:var(--space-2);
  height:var(--row-height-default);padding:0 var(--space-2);
  color:var(--text-tertiary);font-size:var(--text-size-small);
}
.row{
  display:flex;align-items:center;gap:var(--space-2);
  width:100%;height:var(--row-height-default);
  padding-left:var(--space-2);padding-right:var(--space-2);
  border-radius:var(--radius-medium);
  color:var(--text-secondary);font-size:var(--text-size-regular);
  min-width:0;text-align:left;
}
.row:hover{background:var(--surface-hover);color:var(--text-primary)}
.row[data-active]{background:var(--surface-selected);color:var(--text-primary);font-weight:var(--text-weight-medium)}
.rowMark{flex:none;color:var(--identity,var(--icon-default))}
.row[data-active] .rowMark{color:var(--identity,var(--accent))}
.rowLabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowTrailing{
  flex:none;color:var(--text-tertiary);
  font-size:var(--text-size-micro);font-variant-numeric:tabular-nums;
}

/* ── page header inside the canvas ───────────────────────────────────────── */
.pageHeader{display:flex;flex-direction:column;flex:none}
.pathRow{
  display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;
  min-height:var(--row-height-table);padding:var(--space-2) var(--space-3) 0;
}
.crumbs{display:flex;align-items:center;min-width:0}
.crumb{
  display:inline-flex;align-items:center;gap:var(--space-2);
  height:var(--row-height-compact);padding:0 var(--space-2);
  border-radius:var(--radius-medium);
  color:var(--text-tertiary);font-size:var(--text-size-regular);white-space:nowrap;
}
.crumb:hover{background:var(--surface-hover);color:var(--text-primary)}
.crumb[data-last]{color:var(--text-primary);font-weight:var(--text-weight-medium)}
.crumbSep{color:var(--text-quaternary);padding:0 2px;font-size:var(--text-size-regular)}
.crumbMark{flex:none;color:var(--topic-type,var(--icon-tertiary))}
.favBtn{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:var(--row-height-compact);height:var(--row-height-compact);
  border-radius:var(--radius-small);color:var(--icon-tertiary);
}
.favBtn:hover{background:var(--surface-hover);color:var(--text-primary)}
.favBtn[data-on]{color:var(--favorite)}
.members{flex:none;color:var(--text-tertiary);font-size:var(--text-size-small)}
.headerActions{display:flex;align-items:center;gap:var(--space-1);flex:none;margin-left:auto}
.filterRow{
  display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap;
  min-height:var(--row-height-issue);padding:0 var(--space-3) var(--space-1);
}
.searchBox{
  display:inline-flex;align-items:center;gap:var(--space-2);
  flex:0 1 180px;min-width:108px;height:var(--row-height-compact);
  padding:0 var(--space-3);border-radius:var(--radius-pill);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
}
.searchBox svg{color:var(--icon-tertiary);flex:none}
.searchBox input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:var(--text-size-small)}
.searchBox input::placeholder{color:var(--text-quaternary)}
.pill{
  display:inline-flex;align-items:center;gap:var(--space-2);flex:none;
  height:var(--row-height-compact);padding:0 var(--space-3);
  border-radius:var(--radius-pill);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
  color:var(--text-secondary);font-size:var(--text-size-small);white-space:nowrap;
}
.pill:hover{box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--text-primary)}
.pill[aria-pressed='true'],.pill[aria-pressed='true']:hover{
  background:var(--surface-selected);box-shadow:inset 0 0 0 1px transparent;
  color:var(--text-primary);font-weight:var(--text-weight-medium);
}
.pill[data-muted]{color:var(--text-tertiary);cursor:default}
.spacer{flex:1;min-width:var(--space-2)}

/* ── identity marks ──────────────────────────────────────────────────────── */
.mk{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  border-radius:var(--radius-pill);
  background:color-mix(in srgb, var(--identity,var(--identity-gray)) var(--identity-wash), transparent);
  color:var(--identity,var(--identity-gray));
  font-weight:var(--text-weight-medium);letter-spacing:.02em;line-height:1;
  overflow:hidden;
}
.mk[data-size='small']{width:var(--icon-size-prominent);height:var(--icon-size-prominent);font-size:var(--text-size-mini);letter-spacing:0}
.mk[data-size='mark']{width:var(--space-5);height:var(--space-5);font-size:var(--text-size-mini)}
.mk[data-size='large']{width:var(--space-6);height:var(--space-6);font-size:var(--text-size-micro)}

/* ── messages ────────────────────────────────────────────────────────────── */
.stream{display:flex;flex-direction:column;min-width:0;min-height:0}
.chatBody{
  display:grid;flex:1;min-width:0;min-height:0;overflow:hidden;
  --panel-width:380px;
  grid-template-columns:minmax(0,1fr) 0px;
  transition:grid-template-columns var(--duration-panel) var(--ease-panel);
}
.chatBody[data-panel='open']{grid-template-columns:minmax(0,1fr) var(--panel-width)}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:var(--space-2)}
/* A room that has not filled its height still reads from the bottom up: the
   newest thing said sits against the composer, not adrift under the header. */
.scroll[data-anchor='bottom']{display:flex;flex-direction:column}
.scroll[data-anchor='bottom'] > .messages{margin-top:auto}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:rgb(0 0 0 / .13);border-radius:var(--radius-pill);border:2px solid transparent;background-clip:content-box}
.messages{display:flex;flex-direction:column;gap:2px;width:100%}
.msg{
  position:relative;display:flex;align-items:flex-start;gap:var(--space-3);
  padding:var(--space-2) var(--space-3);border-radius:var(--radius-medium);
}
.msgBody{flex:1;padding-right:var(--space-3);min-width:0}
.byline{display:flex;align-items:baseline;gap:var(--space-2)}
.author{color:var(--text-primary);font-size:var(--text-size-regular);font-weight:var(--text-weight-medium)}
.time{color:var(--text-quaternary);font-size:var(--text-size-micro);font-variant-numeric:tabular-nums}
.text{color:var(--text-secondary);font-size:var(--text-size-medium);line-height:var(--line-height-reading)}
.text strong{font-weight:var(--text-weight-bold);color:var(--text-primary)}
.mention{
  display:inline-flex;align-items:baseline;gap:var(--space-1);
  color:var(--text-primary);text-decoration:underline;text-decoration-color:var(--border-strong);
  text-underline-offset:2px;
}
.mention .mk{transform:translateY(2px)}
.refLink{
  display:inline;color:var(--text-primary);

const SIZE = { compact: 12, default: 14, prominent: 16 };
function icon(name, size = 'default', cls = '') {
  const glyph = ICONS[name];

const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function markFor(memberId, size = 'mark') {
  const p = PEOPLE[memberId];
  return `<span class="mk" data-size="${size}" data-identity-color="${p.color}" title="${esc(p.name)}">${esc(p.initials)}</span>`;
}

function spanHtml(span) {
  if (span.mention) {
    const p = PEOPLE[span.mention];
    return `<span class="mention">${markFor(span.mention, 'small')}${esc(p.name)}</span>`;
  }
  if (span.ref) {
    return `<span class="refLink"><span class="refIcon">${icon(span.refIcon || 'thread', 'compact')}</span>${esc(span.ref)}</span>`;
  }
  if (span.topic) {
    return `<span class="topicRef" data-topic-type="${span.topicType}">${icon('type-' + span.topicType, 'compact')} ${esc(span.topic)}</span>`;
  }
  if (span.strong) return `<strong>${esc(span.text)}</strong>`;
  return esc(span.text);
}

function statusOf(msg) {
  if (msg.thread) return state.threads[msg.thread.id].status;
  return msg.status;
}

function reactionChip(msg, stream, reaction, index) {
  const mine = reaction.mine;
  const cls = mine ? 'chipMine' : 'chip';
  const face = reaction.emoji
    ? `<span class="chipEmoji">${reaction.emoji}</span>`
    : `<span class="chipMark" data-reaction="${reaction.key}">${icon('reaction-' + reaction.key, 'compact')}</span>`;
  return `<button class="${cls}" type="button" data-act="toggle-reaction" data-stream="${stream}" data-msg="${msg.id}" data-index="${index}">${face}${reaction.count}</button>`;
}

/*
 * `asParent` is the same message drawn at the top of its own thread. It keeps
 * its corner bar — the thread's status is changed from there — but loses the
 * way in, because the reply count is the line under it and a link back into
 * the panel you are already standing in is a link to here.
 */
function messageHtml(msg, stream, asParent) {
  const person = PEOPLE[msg.author];
  const status = statusOf(msg);
  /* Open earns no badge — the ring in the corner bar already says so. The two
     finished states do, because a badge is also how you take one back. */
  const showStatusChip = Boolean(status) && status !== 'open';
  const statusMeta = STATUSES.find((s) => s.key === status) || STATUSES[0];

  const marks = [];
  if (showStatusChip) {
    marks.push(`<button class="statusChip" type="button" data-status="${status}" data-act="reset-status" data-stream="${stream}" data-msg="${msg.id}">${icon(statusMeta.icon, 'compact')}${statusMeta.label}</button>`);
  }
  if (msg.followUp) {
    marks.push(`<button class="followChip" type="button" data-act="clear-follow-up" data-stream="${stream}" data-msg="${msg.id}" title="Clear follow-up">${icon('timer', 'compact')}${esc(msg.followUp)}</button>`);
  }
  msg.reactions.forEach((r, i) => marks.push(reactionChip(msg, stream, r, i)));

  const threadRow = msg.thread && !asParent
    ? `<div class="threadRow"><button class="replies" type="button" data-act="open-thread" data-thread="${msg.thread.id}">${replyLabel(msg.thread.id)}</button></div>`
    : '';

  const menuOpen = state.menu && state.menu.msgId === msg.id && state.menu.stream === stream;

  return `
  <li class="msg" data-msg="${msg.id}"${menuOpen ? ' data-busy' : ''}>
    ${markFor(msg.author, 'large')}
    <div class="msgBody">
      <div class="byline"><span class="author">${esc(person.name)}</span><span class="time">${esc(msg.time)}</span></div>
      <div class="text">${msg.spans.map(spanHtml).join('')}</div>
      ${marks.length ? `<div class="marks">${marks.join('')}</div>` : ''}
      ${threadRow}
    </div>
    <div class="tools">
      <button class="tool" type="button" data-status="${status || 'open'}" data-act="menu" data-menu="status" data-stream="${stream}" data-msg="${msg.id}" aria-expanded="${menuOpen && state.menu.kind === 'status'}" title="Status">${icon(statusMeta.icon)}</button>
      <button class="tool" type="button" data-act="noop" title="Assignee">${markFor(ME, 'small')}</button>
      <button class="tool" type="button" data-act="noop" title="Tag">${icon('tag')}</button>
      <span class="toolDivider"></span>
      <button class="tool" type="button" data-act="menu" data-menu="reaction" data-stream="${stream}" data-msg="${msg.id}" aria-expanded="${menuOpen && state.menu.kind === 'reaction'}" title="React">${icon('emoji')}</button>
      <button class="tool" type="button" data-act="menu" data-menu="priority" data-stream="${stream}" data-msg="${msg.id}" aria-expanded="${menuOpen && state.menu.kind === 'priority'}" title="Priority">${icon('priority-medium')}</button>
      <button class="tool" type="button" data-act="follow-up" data-stream="${stream}" data-msg="${msg.id}" title="Set a follow-up">${icon('timer')}</button>
      <button class="tool" type="button" data-act="noop" title="More">${icon('ellipsis')}</button>
      ${menuOpen ? menuHtml(state.menu, msg, stream) : ''}
    </div>
  </li>`;
}

function menuHtml(menu, msg, stream) {
  if (menu.kind === 'status') {
    const current = statusOf(msg);
    return `<div class="menu" style="top:calc(100% + 4px);left:0" data-menu-body>${
      STATUSES.map((s) => `
        <button class="menuItem" type="button" data-act="set-status" data-stream="${stream}" data-msg="${msg.id}" data-value="${s.key}"${s.key === current ? ' data-on' : ''}>
          <span class="menuMark" data-status="${s.key}">${icon(s.icon)}</span>
          <span class="menuLabel">${s.label}</span>
          ${s.key === current ? `<span class="menuCheck">${icon('check', 'compact')}</span>` : ''}
        </button>`).join('')
    }</div>`;
  }
  if (menu.kind === 'reaction') {
    return `<div class="menu reactionMenu" style="top:calc(100% + 4px);right:0" data-menu-body>${
      REACTIONS.map((r) => `
        <button class="reactionOpt" type="button" data-reaction="${r.key}" data-act="add-reaction" data-stream="${stream}" data-msg="${msg.id}" data-value="${r.key}" title="${r.label}">${icon('reaction-' + r.key)}</button>`).join('')
    }</div>`;
  }
  if (menu.kind === 'priority') {
    const items = [
      { key: 'urgent', label: 'Urgent' }, { key: 'high', label: 'High' },
      { key: 'medium', label: 'Medium' }, { key: 'low', label: 'Low' }, { key: 'none', label: 'No priority' },
    ];
    return `<div class="menu" style="top:calc(100% + 4px);right:0" data-menu-body>${
      items.map((p) => `
        <button class="menuItem" type="button" data-act="close-menu">
          <span class="menuMark" style="color:${p.key === 'urgent' ? 'var(--priority-urgent)' : 'var(--icon-default)'}">${icon('priority-' + p.key)}</span>
          <span class="menuLabel">${p.label}</span>
        </button>`).join('')
    }</div>`;
  }
  return '';
}

function replyLabel(threadId) {
  const n = state.streams[threadId].length;
  return n === 1 ? '1 reply' : `${n} replies`;
}

function streamHtml(stream) {
  const list = state.streams[stream];
  const out = [];
  let day = null;
  list.forEach((msg) => {
    if (msg.day !== day) {
      day = msg.day;
      out.push(`<li class="divider"><span class="dividerLabel">${esc(day)}</span></li>`);
    }
    out.push(messageHtml(msg, stream));
  });
  return out.join('');
}

    <button class="attach" type="button" data-act="noop" title="Attach files">${icon('attach')}</button>

    <button class="send" type="submit" data-send="${stream}" title="Send" disabled>${icon('send')}</button>
  </form>`;

const app = document.getElementById('app');

/*
 * What is half-typed is not state.
 *
 * The composer's text lives in the DOM, the way it does in the product, so a
 * re-render for something else — a menu opening, a status changing — has to
 * hand it back or it would eat a sentence somebody was in the middle of.
 */
function captureDrafts() {
  const drafts = {};
  app.querySelectorAll('[data-editor]').forEach((el) => { drafts[el.dataset.editor] = el.innerText; });
  return drafts;
}

function restoreDrafts(drafts) {
  app.querySelectorAll('[data-editor]').forEach((el) => {
    const text = drafts[el.dataset.editor];
    if (text && text.trim()) el.innerText = text;
    syncEditor(el);
  });
}

function render() {
  const drafts = captureDrafts();
  const canvas =
    state.view === 'topic' ? roomHtml() :
    state.view === 'my-threads' ? myThreadsHtml() :
    followUpsHtml();

  app.innerHTML = `

  restoreDrafts(drafts);
  restoreScroll();
}

/* Where each stream was scrolled to, so a re-render does not jump the room. */
const scrollTops = {};
let scrollTarget = null;

function restoreScroll() {
  app.querySelectorAll('[data-scroll]').forEach((el) => {
    const key = el.dataset.scroll;
    if (scrollTarget === key) { el.scrollTop = el.scrollHeight; scrollTops[key] = el.scrollTop; }
    else if (scrollTops[key] != null) el.scrollTop = scrollTops[key];
    /* A room opens where it was left off — at the newest thing said. A thread
       opens at the message it is about, which is the top of it. */
    else el.scrollTop = key === 'room' ? el.scrollHeight : 0;
    el.addEventListener('scroll', () => { scrollTops[key] = el.scrollTop; }, { passive: true });
  });
  scrollTarget = null;
}

/* ══════════════════════════════════════════════════════════════════════════
   What pressing things does.
   ══════════════════════════════════════════════════════════════════════════ */
function findMessage(stream, id) {
  return state.streams[stream].find((m) => m.id === id);
}

function now() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function send(stream, text) {
  const body = text.replace(/\s+/g, ' ').trim();
  if (!body) return;
  /* Empty the box before the render, so the draft it hands back is this one. */
  const sent = app.querySelector(`[data-editor="${stream}"]`);
  if (sent) sent.innerHTML = '';
  state.streams[stream].push({
    id: nextId(), author: ME, time: now(), day: 'Today', status: null,
    spans: [t(body)], reactions: [], thread: null, followUp: null,
  });
  state.menu = null;
  scrollTarget = stream;
  render();
  const editor = app.querySelector(`[data-editor="${stream}"]`);
  if (editor) { editor.focus(); }
}

function readEditor(el) {
  return (el.innerText || '').replace(/ /g, ' ');
}

function syncEditor(el) {
  const empty = readEditor(el).trim().length === 0;
  el.dataset.empty = empty ? 'true' : 'false';
  const form = el.closest('.composer');
  const btn = form && form.querySelector('.send');
  if (btn) btn.disabled = empty;
}

app.addEventListener('click', (event) => {
  const hit = event.target.closest('[data-act]');
  /*
   * Everything the handler needs is read off the element *before* anything
   * renders — a render replaces the node the click arrived on, and reaching
   * back through it afterwards reads a element that is no longer in the page.
   */
  const act = hit ? hit.dataset.act : null;
  const data = hit ? Object.assign({}, hit.dataset) : {};
  const stream = data.stream;
  const msgId = data.msg;

  /* A click that is neither inside an open menu nor on its own trigger shuts it. */
  let dirty = false;
  if (state.menu && !event.target.closest('[data-menu-body]') && act !== 'menu') {
    state.menu = null;
    dirty = true;
  }
  if (!act) { if (dirty) render(); return; }

  switch (act) {
    case 'noop':
      event.preventDefault();
      if (dirty) render();
      break;

    case 'view': {
      const value = data.value;
      if (!value) { if (dirty) render(); break; }
      state.view = value;
      state.menu = null;
      render();
      break;
    }

    case 'favorite':
      state.favorite = !state.favorite;
      render();
      break;

    case 'open-thread':
      state.view = 'topic';
      state.threadOpen = data.thread;
      state.menu = null;
      render();
      break;

    case 'close-thread':
      state.threadOpen = null;
      state.menu = null;
      render();
      break;

    case 'open-row': {
      state.view = 'topic';
      state.threadOpen = data.thread || null;
      render();
      break;
    }

    case 'menu': {
      const kind = data.menu;
      const same = state.menu && state.menu.kind === kind && state.menu.msgId === msgId && state.menu.stream === stream;
      state.menu = same ? null : { kind, msgId, stream };
      render();
      break;
    }

    case 'close-menu':
      state.menu = null;
      render();
      break;

    case 'set-status': {
      const msg = findMessage(stream, msgId);
      if (msg && msg.thread) state.threads[msg.thread.id].status = data.value;
      else if (msg) msg.status = data.value;
      state.menu = null;
      render();
      break;
    }

    case 'reset-status': {
      const msg = findMessage(stream, msgId);
      if (msg && msg.thread) state.threads[msg.thread.id].status = 'open';
      else if (msg) msg.status = 'open';
      render();
      break;
    }

    case 'add-reaction': {
      const msg = findMessage(stream, msgId);
      const key = data.value;
      const existing = msg.reactions.find((r) => r.key === key);
      if (existing) {
        if (!existing.mine) { existing.mine = true; existing.count += 1; }
      } else {
        msg.reactions.push({ key, count: 1, mine: true });
      }
      state.menu = null;
      render();
      break;
    }

    case 'toggle-reaction': {
      const msg = findMessage(stream, msgId);
      const r = msg.reactions[Number(data.index)];
      if (!r) break;
      if (r.mine) { r.mine = false; r.count -= 1; if (r.count <= 0) msg.reactions.splice(msg.reactions.indexOf(r), 1); }
      else { r.mine = true; r.count += 1; }
      render();
      break;
    }

    case 'follow-up':
      state.menu = null;
      state.dialog = { kind: 'follow-up', msgId, stream, when: FOLLOW_UP_WHENS[0], type: FOLLOW_UP_KINDS[0] };
      render();
      break;

    case 'cycle-when': {
      const i = FOLLOW_UP_WHENS.indexOf(state.dialog.when);
      state.dialog.when = FOLLOW_UP_WHENS[(i + 1) % FOLLOW_UP_WHENS.length];
      render();
      break;
    }

    case 'cycle-kind': {
      const i = FOLLOW_UP_KINDS.indexOf(state.dialog.type);
      state.dialog.type = FOLLOW_UP_KINDS[(i + 1) % FOLLOW_UP_KINDS.length];
      render();
      break;
    }

    case 'confirm-follow-up':
      confirmFollowUp();
      break;

    case 'close-dialog':
      state.dialog = null;
      render();
      break;

    case 'clear-follow-up': {
      const msg = findMessage(stream, msgId);
      if (!msg) break;
      state.followUps = state.followUps.filter((f) => f.id !== `fu_${msg.id}`);
      msg.followUp = null;
      render();
      break;
    }
  }
});

function confirmFollowUp() {
  const d = state.dialog;
  if (!d) return;
  const msg = findMessage(d.stream, d.msgId);
  if (msg) {
    msg.followUp = d.when;
    const title = msg.spans.map((s) => s.text || s.ref || s.topic || '').join('').trim().slice(0, 52) || 'Follow up';
    const id = `fu_${msg.id}`;
    state.followUps = state.followUps.filter((f) => f.id !== id);
    state.followUps.push({
      id, title, preview: `${d.type} · set by ${PEOPLE[ME].name}`,
      priority: 'medium', owner: ME, due: `Due ${d.when.toLowerCase()}`,
      overdue: false, unread: 0, kind: d.type === 'Reminder' ? 'timer' : 'agent',
    });
  }
  state.dialog = null;
  render();
}

/*
 * One listener, on the document rather than on the app.
 *
 * Escape has to work when nothing inside the app holds focus — after a click on
 * the page, or on arrival — and a listener on the app only ever sees keys that
 * started inside it. Enter still finds its composer through the event's target.
 */
document.addEventListener('keydown', (event) => {
  const editor = event.target.closest && event.target.closest('[data-editor]');

  if (event.key === 'Enter' && !event.shiftKey) {
    if (editor) {
      event.preventDefault();
      send(editor.dataset.editor, readEditor(editor));
    } else if (state.dialog) {
      event.preventDefault();
      confirmFollowUp();
    }
    return;
  }

  if (event.key !== 'Escape') return;

  /* Innermost first, and the page's own panel is outside all of it. */
  if (aboutScrim.hasAttribute('data-open')) { aboutScrim.removeAttribute('data-open'); return; }
  if (state.dialog) { state.dialog = null; render(); return; }
  if (state.menu) { state.menu = null; render(); return; }
  if (state.threadOpen) { state.threadOpen = null; render(); }
});

app.addEventListener('submit', (event) => {
  event.preventDefault();
  const form = event.target.closest('.composer');
  if (!form) return;
  const editor = form.querySelector('[data-editor]');
  send(editor.dataset.editor, readEditor(editor));
});

/* Paste as text: a pasted heading should not arrive as a heading. */
app.addEventListener('paste', (event) => {
  const editor = event.target.closest('[data-editor]');
  if (!editor) return;
  event.preventDefault();
  const text = (event.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text.replace(/\s+/g, ' '));
});

/* ══════════════════════════════════════════════════════════════════════════
   Fitting the window to whatever room the frame has.

   The window is drawn once at a fixed size, so a 13px row is the same row at
   every viewport; the frame scales it rather than reflowing it.
   ══════════════════════════════════════════════════════════════════════════ */
const scaler = document.getElementById('scaler');
const artEl = document.querySelector('.art');
const heroEl = document.querySelector('.hero');
const copyEl = document.querySelector('.copy');

/* How large the app is drawn before scaling, and how far the scale may go. */
const BASE_WIDTH = { wide: 1120, stacked: 780 };
const SCALE_MAX = 1.2;
const WIN_H_MIN = 460;
/* A window is wider than it is tall. Past this the mock stops reading as a
   desktop app and starts reading as a phone drawn at desktop type sizes. */
const WIN_ASPECT_MAX = 1.15;

function fit() {
  /*
   * Nothing to fit into yet — a hidden pane, a tab that has never been painted.
   * Measuring it would collapse the window and leave it collapsed until
   * something else happened to fire this.
   */
  if (heroEl.clientWidth <= 0 || heroEl.clientHeight <= 0) return;

  const stacked = window.innerWidth <= 1080;
  const w = stacked ? BASE_WIDTH.stacked : BASE_WIDTH.wide;
  if (stacked) app.setAttribute('data-compact', ''); else app.removeAttribute('data-compact');

  const style = getComputedStyle(artEl);
  const padX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
  const padY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);

  /*
   * Both budgets are read off the row the frame sits in, never off the frame
   * itself: the frame hugs the window, so measuring it to decide how big the
   * window should be is how a fit routine oscillates. The track widths are the
   * used values the grid resolved, which no amount of scaling can change.
   */
  const tracks = getComputedStyle(heroEl).gridTemplateColumns.split(' ').map(parseFloat);
  const gap = parseFloat(getComputedStyle(heroEl).rowGap) || 0;
  const availW = Math.max(0, tracks[tracks.length - 1] - padX);
  const availH = Math.max(0, heroEl.clientHeight - (stacked ? copyEl.offsetHeight + gap : 0) - padY);
  if (availW <= 0 || availH <= 0) return;

  /*
   * The scale comes from the width, and the window's *height* then comes from
   * whatever room is left — so the frame is filled rather than letterboxed,
   * and a taller page simply shows more of the conversation. Only when the
   * room is too short for a window worth showing does the scale give way.
   */
  let k = Math.min(availW / w, SCALE_MAX);
  let h = availH / k;
  if (h < WIN_H_MIN) { h = WIN_H_MIN; k = availH / WIN_H_MIN; }
  h = Math.min(h, w * WIN_ASPECT_MAX);

  app.style.setProperty('--win-w', `${Math.round(w)}px`);
  app.style.setProperty('--win-h', `${Math.round(h)}px`);
  app.style.setProperty('--k', k.toFixed(4));
  scaler.style.width = `${w * k}px`;
  scaler.style.height = `${h * k}px`;
}

const ro = new ResizeObserver(() => fit());
ro.observe(heroEl);
window.addEventListener('resize', fit);

render();
fit();

})();
</script>

</body>
