function now() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function send(streamKey) {
  const sent = app.querySelector(`[data-editor="${streamKey}"]`);
  if (!sent) return;
  const spans = readSpans(sent);
  if (!spans.length) return;

  closeMention();
  /* Empty the box before the render, so the draft it hands back is this one. */
  sent.innerHTML = '';

  if (streamKey === 'agent') { ask(spans.map((sp) => sp.text || '').join('').trim()); return; }

  streamOf(streamKey).push({
    id: nextId(), author: ME, time: now(), day: 'Today', status: null,
    spans, reactions: [], thread: null, followUp: null,
  });
  state.menu = null;
  scrollTarget = streamKey;
  render();
  const editor = app.querySelector(`[data-editor="${streamKey}"]`);
  if (editor) editor.focus();
}

function readEditor(el) {
  return (el.innerText || '').replace(/ /g, ' ');
}

function syncEditor(el) {
  const empty = readEditor(el).trim().length === 0 && !el.querySelector('.mentionChip');
  el.dataset.empty = empty ? 'true' : 'false';
  const form = el.closest('.composer');
  const btn = form && form.querySelector('.send');
  if (btn) btn.disabled = empty;
}

/*
 * Asking the agent, and watching it work.
 *
 * The turn is written the moment the question is: a running line that swaps in
 * place, then the answer where the work was. Timers stand in for a stream —
 * everything the real screen does with tokens, this does with three beats.
 */
const timers = [];
function clearTimers() { timers.splice(0).forEach(clearTimeout); }

/* What was asked decides what comes back; a suggestion chip is just one way to ask. */
function answerFor(text) {
  const asked = text.trim().toLowerCase().replace(/[?.]+$/, '');
  const i = SUGGESTIONS.findIndex((sug) => sug.toLowerCase().replace(/[?.]+$/, '') === asked);
  if (i !== -1) return ANSWERS[i];
  return CANNED[asked] || FALLBACK;
}

function ask(text) {
  const answer = answerFor(text);
  const turn = {
    id: nextId(), role: 'agent', state: 'running',
    activity: answer.activity[0], workLabel: answer.workLabel,
    steps: answer.steps, blocks: null, stepsOpen: false,
  };
  state.agent.turns.push({ role: 'you', text });
  state.agent.turns.push(turn);
  state.agent.busy = true;
  scrollTarget = 'agent';
  render();

  clearTimers();
  const BEAT = 1100;
  answer.activity.slice(1).forEach((line, i) => {
    timers.push(setTimeout(() => {
      turn.activity = line;
      scrollTarget = 'agent';
      render();
    }, BEAT * (i + 1)));
  });
  timers.push(setTimeout(() => {
    turn.state = 'done';
    turn.blocks = answer.blocks;
    /* What it reports and what it changed are the same act. */
    if (answer.effect) answer.effect();
    state.agent.busy = false;
    scrollTarget = 'agent';
    render();
  }, 700 * answer.activity.length + 400));
}

app.addEventListener('click', (event) => {
  const hit = event.target.closest('[data-act]');
  /*
   * Everything the handler needs is read off the element *before* anything
   * renders — a render replaces the node the click arrived on, and reaching
   * back through it afterwards reads an element no longer in the page.
   */
  const act = hit ? hit.dataset.act : null;
  const data = hit ? Object.assign({}, hit.dataset) : {};
  const stream = data.stream;
  const msgId = data.msg;

  /* A click that is neither inside an open menu nor on its own trigger shuts it. */
  let dirty = false;
  const insideMenu = Boolean(event.target.closest('[data-menu-body]'));
  if (state.menu && !insideMenu && act !== 'menu') { state.menu = null; dirty = true; }
  if (state.rowMenu && !insideMenu && act !== 'row-priority-menu') { state.rowMenu = null; dirty = true; }
  if (!act) { if (dirty) render(); return; }

  switch (act) {
    case 'noop':
      event.preventDefault();
      if (dirty) render();
      break;

    case 'view':
      state.view = data.value;
      state.menu = null;
      state.rowMenu = null;
      render();
      break;

    case 'open-room':
      state.view = 'room';
      state.room = data.value;
      state.threadOpen = null;
      state.menu = null;
      render();
      break;

    case 'open-row': {
      if (!data.room) { if (dirty) render(); break; }
      state.view = 'room';
      state.room = data.room;
      state.threadOpen = data.thread || null;
      state.menu = null;
      render();
      break;
    }

    case 'toggle-filter': {
      const f = filterState(data.view);
      f.on = f.on.includes(data.value) ? f.on.filter((l) => l !== data.value) : f.on.concat(data.value);
      render();
      break;
    }

    case 'row-priority-menu': {
      const same = state.rowMenu && state.rowMenu.list === data.list && state.rowMenu.id === data.row;
      state.rowMenu = same ? null : { list: data.list, id: data.row };
      state.menu = null;
      render();
      break;
    }

    case 'set-row-priority': {
      const target = findListRow(data.list, data.row);
      if (target) setRowPriority(target, data.value);
      state.rowMenu = null;
      render();
      break;
    }

    case 'toggle-section':
    case 'toggle-group':
      state.open[data.value] = state.open[data.value] === false;
      render();
      break;

    case 'favorite':
      room().favorite = !room().favorite;
      render();
      break;

    case 'toggle-open-filter':
      state.openOnly[state.room] = !state.openOnly[state.room];
      render();
      break;

    case 'open-thread':
      state.view = 'room';
      state.threadOpen = data.thread;
      state.menu = null;
      render();
      break;

    case 'close-thread':
      state.threadOpen = null;
      state.menu = null;
      render();
      break;

    case 'menu': {
      const kind = data.menu;
      const same = state.menu && state.menu.kind === kind && state.menu.msgId === msgId
        && state.menu.stream === stream && state.menu.place === data.place;
      state.menu = same ? null : { kind, msgId, stream, place: data.place };
      render();
      break;
    }

    case 'set-assignee': {
      const msg = findMessage(stream, msgId);
      if (msg) msg.assignee = data.value;
      state.menu = null;
      render();
      break;
    }

    case 'set-status': {
      const msg = findMessage(stream, msgId);
      if (msg) msg.status = data.value;
      state.menu = null;
      render();
      break;
    }

    case 'reset-status': {
      const msg = findMessage(stream, msgId);
      if (msg) msg.status = 'open';
      render();
      break;
    }

    case 'add-reaction': {
      const msg = findMessage(stream, msgId);
      const key = data.value;
      const existing = msg.reactions.find((r) => r.key === key);
      if (existing) {
        if (!existing.mine) { existing.mine = true; existing.count += 1; }
      } else {
        msg.reactions.push({ key, count: 1, mine: true });
      }
      state.menu = null;
      render();
      break;
    }

    case 'toggle-reaction': {
      const msg = findMessage(stream, msgId);
      const r = msg.reactions[Number(data.index)];
      if (!r) break;
      if (r.mine) { r.mine = false; r.count -= 1; if (r.count <= 0) msg.reactions.splice(msg.reactions.indexOf(r), 1); }
      else { r.mine = true; r.count += 1; }
      render();
      break;
    }

    case 'follow-up':
      state.menu = null;
      state.dialog = { msgId, stream, roomKey: state.room, kind: FOLLOW_UP_KINDS[0].key, when: FOLLOW_UP_WHENS[0], note: '' };
      render();
      break;

    case 'cycle-when': {
      const i = FOLLOW_UP_WHENS.indexOf(state.dialog.when);
      state.dialog.when = FOLLOW_UP_WHENS[(i + 1) % FOLLOW_UP_WHENS.length];
      render();
      break;
    }

    case 'cycle-kind': {
      const i = FOLLOW_UP_KINDS.findIndex((k) => k.key === state.dialog.kind);
      state.dialog.kind = FOLLOW_UP_KINDS[(i + 1) % FOLLOW_UP_KINDS.length].key;
      render();
      break;
    }

    case 'confirm-follow-up':
      confirmFollowUp();
      break;

    case 'close-dialog':
      state.dialog = null;
      render();
      break;

    case 'clear-follow-up': {
      const msg = findMessage(stream, msgId);
      if (!msg) break;
      state.followUps = state.followUps.filter((f) => f.id !== `fu_${msg.id}`);
      msg.followUp = null;
      render();
      break;
    }

    case 'ask':
      ask(SUGGESTIONS[Number(data.value)]);
      break;

    case 'new-chat':
      clearTimers();
      state.agent = { turns: [], busy: false };
      render();
      break;

    case 'toggle-steps': {
      const turn = state.agent.turns.find((t2) => t2.id === data.value);
      if (turn) turn.stepsOpen = !turn.stepsOpen;
      render();
      break;
    }
  }
});

function confirmFollowUp() {
  const d = state.dialog;
  if (!d) return;
  const msg = findMessage(d.stream, d.msgId);
  if (msg) {
    const kind = FOLLOW_UP_KINDS.find((k) => k.key === d.kind) || FOLLOW_UP_KINDS[0];
    msg.followUp = { kind: kind.key, when: d.when };
    const title = msg.spans.map((s) => s.text || s.ref || s.topic || '').join('').trim().slice(0, 52) || 'Follow up';
    const id = `fu_${msg.id}`;
    state.followUps = state.followUps.filter((f) => f.id !== id);
    state.followUps.push({
      id, title,
      preview: d.note.trim() || (kind.agentic ? `${kind.label} — set by you` : 'Reminder — set by you'),
      priority: state.rooms[d.roomKey].priority, owner: ME,
      due: `Due ${d.when.toLowerCase()}`, overdue: false, unread: 0,
      agentic: kind.agentic,
      room: state.rooms[d.stream] ? d.stream : d.roomKey,
      thread: state.threads[d.stream] ? d.stream : null,
    });
  }
  state.dialog = null;
  render();
}

/* Composers: typing, Enter, and the send button. */
app.addEventListener('input', (event) => {
  const editor = event.target.closest('[data-editor]');
  if (editor) { syncEditor(editor); syncMention(editor); return; }

  const note = event.target.closest('[data-followup-note]');
  if (note) {
    /* Held, not drawn: the dialog only re-renders when a chip is cycled, and
       the value has to survive that without the caret being taken along. */
    if (state.dialog) state.dialog.note = note.value;
    return;
  }

  const search = event.target.closest('[data-search]');
  if (!search) return;
  /*
   * The list is redrawn on every keystroke, which replaces the box being typed
   * in — so the caret is put back at the end of what was typed. The value
   * itself is state, because it survives leaving the screen and coming back.
   */
  const view = search.dataset.search;
  filterState(view).search = search.value;
  render();
  const again = app.querySelector(`[data-search="${view}"]`);
  if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
});

app.addEventListener('submit', (event) => {
  event.preventDefault();
  const form = event.target.closest('.composer');
  if (!form) return;
  const editor = form.querySelector('[data-editor]');
  send(editor.dataset.editor);
});

/* Paste as text: a pasted heading should not arrive as a heading. */
app.addEventListener('paste', (event) => {
  const editor = event.target.closest('[data-editor]');
  if (!editor) return;
  event.preventDefault();
  const text = (event.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text.replace(/\s+/g, ' '));
});

/*
 * One listener, on the document rather than on the app.
 *
 * Escape has to work when nothing inside the app holds focus — after a click on
 * the page, or on arrival — and a listener on the app only ever sees keys that
 * started inside it. Enter still finds its composer through the event's target.
 */
document.addEventListener('keydown', (event) => {
  const editor = event.target.closest && event.target.closest('[data-editor]');

  /* An open typeahead owns the arrows, Enter and Escape until it is done with. */
  if (mention && editor) {
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      const step = event.key === 'ArrowDown' ? 1 : -1;
      mention.index = (mention.index + step + mention.matches.length) % mention.matches.length;
      drawMention();
      return;
    }
    if (event.key === 'Enter' || event.key === 'Tab') {
      event.preventDefault();
      takeMention(mention.matches[mention.index]);
      return;
    }
    if (event.key === 'Escape') { event.preventDefault(); closeMention(); return; }
  }

  if (event.key === 'Enter' && !event.shiftKey) {
    if (editor) {
      event.preventDefault();
      send(editor.dataset.editor);
    } else if (state.dialog) {
      event.preventDefault();
      confirmFollowUp();
    }
    return;
  }

  if (event.key !== 'Escape') return;

  /* Innermost first. */
  if (state.dialog) { state.dialog = null; render(); return; }
  if (state.menu || state.rowMenu) { state.menu = null; state.rowMenu = null; render(); return; }
  if (state.threadOpen) { state.threadOpen = null; render(); }
});


/* ══════════════════════════════════════════════════════════════════════════
   The composer's mention typeahead.

   `@` is one of the product's four composer sigils. What is typed after it
   narrows a list of people; taking a row drops a finished mention into the box
   and the caret carries on after it.

   All of it is imperative — the panel is placed and updated by hand, never
   through `render()`, because re-rendering the box somebody is typing in takes
   the caret with it.
   ══════════════════════════════════════════════════════════════════════════ */
const MENTIONABLE = ['m_yariv', 'm_david', 'm_elena', 'm_sarah', 'm_priya', 'm_marco', 'm_tom', 'm_grace'];
let mention = null;   // { editor, query, matches, index }

function mentionPanel() {
  let el = app.querySelector('.typeahead');
  if (!el) {
    el = document.createElement('div');
    el.className = 'typeahead';
    el.setAttribute('role', 'listbox');
    el.setAttribute('aria-label', 'People');
    app.appendChild(el);
  }
  return el;
}

function closeMention() {
  mention = null;
  const el = app.querySelector('.typeahead');
  if (el) el.remove();
}

/* What has been typed since an `@` that begins a word, or nothing. */
function mentionQuery(editor) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  const node = sel.focusNode;
  if (!node || node.nodeType !== 3 || !editor.contains(node)) return null;
  const upto = node.textContent.slice(0, sel.focusOffset);
  const at = upto.lastIndexOf('@');
  if (at === -1) return null;
  const before = at === 0 ? ' ' : upto[at - 1];
  if (!/\s|\u00a0/.test(before)) return null;
  const query = upto.slice(at + 1);
  if (/\s/.test(query)) return null;
  return { node, at, offset: sel.focusOffset, query };
}

function syncMention(editor) {
  const found = mentionQuery(editor);
  if (!found) { closeMention(); return; }

  const needle = found.query.toLowerCase();
  const matches = MENTIONABLE.filter((id) => PEOPLE[id].name.toLowerCase().includes(needle));
  if (!matches.length) { closeMention(); return; }

  mention = Object.assign({ editor, matches, index: 0 }, found);
  drawMention();
}

function drawMention() {
  if (!mention) return;
  const el = mentionPanel();
  el.innerHTML = `<p class="typeaheadHeading">People</p>${
    mention.matches.map((id, i) => `
      <div class="typeaheadOption" role="option" aria-selected="${i === mention.index}"${i === mention.index ? ' data-active' : ''} data-mention="${id}">
        ${markFor(id, 'small')}
        <span class="typeaheadText">
          <span>${esc(PEOPLE[id].name)}</span>
          <span class="typeaheadDetail">${id === ME ? 'you' : ''}</span>
        </span>
      </div>`).join('')
  }`;

  /* Above the composer it belongs to, in the window's own coordinates. */
  const form = mention.editor.closest('.composer');
  const win = app.getBoundingClientRect();
  const k = win.width / app.offsetWidth || 1;
  const r = form.getBoundingClientRect();
  const left = (r.left - win.left) / k;
  const bottom = (win.bottom - r.top) / k + 6;
  el.style.left = `${Math.round(left)}px`;
  el.style.bottom = `${Math.round(bottom)}px`;
}

/* Take a row: the `@word` becomes a finished mention and the caret follows it. */
function takeMention(id) {
  if (!mention) return;
  const { editor, node, at, offset } = mention;
  const range = document.createRange();
  range.setStart(node, at);
  range.setEnd(node, offset);
  range.deleteContents();

  const chip = document.createElement('span');
  chip.className = 'mentionChip';
  chip.contentEditable = 'false';
  chip.dataset.member = id;
  chip.innerHTML = `${markFor(id, 'small')}${esc(PEOPLE[id].name)}`;

  const tail = document.createTextNode('\u00a0');
  range.insertNode(tail);
  range.insertNode(chip);

  const after = document.createRange();
  after.setStart(tail, 1);
  after.collapse(true);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(after);

  closeMention();
  syncEditor(editor);
  editor.focus();
}

/*
 * Reading the box back out.
 *
 * A draft is a run of text nodes and mention chips, which is exactly the span
 * list a message is made of — so this walks the children rather than parsing a
 * string, and a name somebody typed by hand never becomes a mention by accident.
 */
function readSpans(editor) {
  const spans = [];
  const push = (text) => {
    const clean = text.replace(/\u00a0/g, ' ');
    if (!clean) return;
    const last = spans[spans.length - 1];
    if (last && last.text !== undefined) last.text += clean;
    else spans.push({ text: clean });
  };
  editor.childNodes.forEach((node) => {
    if (node.nodeType === 3) push(node.textContent);
    else if (node.classList && node.classList.contains('mentionChip')) spans.push({ mention: node.dataset.member });
    else push(node.textContent || '');
  });
  /* Trim the ends without touching the join between a mention and its sentence. */
  if (spans.length && spans[0].text !== undefined) spans[0].text = spans[0].text.replace(/^\s+/, '');
  const end = spans[spans.length - 1];
  if (end && end.text !== undefined) end.text = end.text.replace(/\s+$/, '');
  return spans.filter((sp) => sp.mention || sp.text);
}

app.addEventListener('mousedown', (event) => {
  const option = event.target.closest('[data-mention]');
  if (!option) return;
  event.preventDefault();
  takeMention(option.dataset.mention);
});


/* ══════════════════════════════════════════════════════════════════════════
   The demo.

   A cursor drives the real app: every step resolves a selector against the DOM
   that is actually on screen and clicks the button that is actually there. So
   the reel cannot drift from the product — if a control moves, the demo breaks
   loudly rather than showing something the app no longer does.

   Three chapters, in the order the argument goes: you do it, you hand it to
   time, you ask the agent what is left.
   ══════════════════════════════════════════════════════════════════════════ */
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOVE_MS = REDUCED ? 0 : 640;
const CLICK_MS = 210;
const SETTLE_MS = 420;
const TYPE_MS = 46;
/* Long enough after a view changes that the eye lands before the cursor does. */
const READ_MS = 900;

const chaptersEl = document.getElementById('chapters');
let cursorEl = null;
let run = null;      // the token of the chapter currently playing
let chapter = 0;

/* ── steps ───────────────────────────────────────────────────────────────── */
const one = (query) => ({ find: () => app.querySelector(query) });
/* A row is found by what it says, because its position is the thing on trial. */
const saying = (query, text) => ({
  find: () => [...app.querySelectorAll(query)].find((n) => n.textContent.includes(text)) || null,
});
const newest = (query) => ({ find: () => { const all = app.querySelectorAll(query); return all[all.length - 1] || null; } });

const click = (target) => ({ kind: 'click', target });
const hover = (target) => ({ kind: 'hover', target });
const write = (target, text) => ({ kind: 'type', target, text });
const pause = (ms) => ({ kind: 'wait', ms });

function stepCost(step) {
  if (step.kind === 'wait') return step.ms;
  if (step.kind === 'type') return MOVE_MS + step.text.length * TYPE_MS + 220;
  if (step.kind === 'hover') return MOVE_MS + 120;
  return MOVE_MS + CLICK_MS + SETTLE_MS;
}

/* ── the chapters ────────────────────────────────────────────────────────── */
const CHAPTERS = [
  {
    id: 'triage',
    label: 'Triage a thread',
    /* Arrives showing everything, so the filter has something to do at the end. */
    open: () => { state.view = 'my-threads'; filterState('my-threads').on = []; },
    steps: () => [
      /* A beat on the list first: this is the queue, and it is what changes. */
      pause(2200),
      click(saying('.itemFace', 'Per-key or per-org rate limits?')),
      pause(READ_MS),
      write(one('[data-editor="t_301"]'), 'Going with per-org. @pri'),
      pause(520),
      click(one('[data-mention="m_priya"]')),
      write(one('[data-editor="t_301"]'), 'can you land the sub-limit today?'),
      pause(360),
      click(one('.panel .composer .send')),
      pause(READ_MS),
      hover(one('.panel .msg[data-msg="r2"]')),
      click(one('.panel .msg[data-msg="r2"] [data-menu="assignee"]')),
      pause(520),
      click(one('[data-act="set-assignee"][data-value="m_priya"]')),
      pause(760),
      hover(one('.panel .msg[data-msg="r2"]')),
      click(one('.panel .msg[data-msg="r2"] [data-menu="status"]')),
      pause(520),
      click(one('[data-act="set-status"][data-value="resolved"]')),
      pause(1100),

      /* Back to the queue, and a second one closed without a word typed. */
      click(one('[data-act="view"][data-value="my-threads"]')),
      pause(1300),
      click(saying('.itemFace', 'Dead letter queue handling')),
      pause(READ_MS),
      hover(one('.panel .msg[data-msg="x3"]')),
      click(one('.panel .msg[data-msg="x3"] [data-menu="status"]')),
      pause(520),
      click(one('[data-act="set-status"][data-value="resolved"]')),
      pause(1100),
      click(one('[data-act="view"][data-value="my-threads"]')),
      pause(1600),

      /* Two are done. Ask for what is still open and watch them go. */
      click(saying('.pill', 'Open')),
      pause(2400),
    ],
  },
  {
    id: 'follow-up',
    label: 'Set an agentic follow-up',
    open: () => { state.view = 'room'; state.room = 'rate-limits'; },
    steps: () => [
      pause(1400),
      write(one('[data-editor="rate-limits"]'), '@tom'),
      pause(520),
      click(one('[data-mention="m_tom"]')),
      write(one('[data-editor="rate-limits"]'), 'can you confirm the burst number before Thursday?'),
      pause(360),
      click(one('.stream .composer .send')),
      pause(READ_MS),
      hover(newest('.stream .messages .msg')),
      click({ find: () => {
        const msgs = app.querySelectorAll('.stream .messages .msg');
        const msg = msgs[msgs.length - 1];
        return msg && msg.querySelector('[data-act="follow-up"]');
      } }),
      pause(READ_MS),
      /* Who does it, when, and — the part that matters — what they should do. */
      click(one('[data-act="cycle-kind"]')),
      pause(620),
      click(one('[data-act="cycle-when"]')),
      pause(620),
      write(one('[data-followup-note]'), 'If Tom has not given a number, ask him again in the thread.'),
      pause(700),
      click(one('[data-act="confirm-follow-up"]')),
      pause(1200),
      click(one('[data-act="view"][data-value="follow-ups"]')),
      pause(2600),
    ],
  },
  {
    id: 'agent',
    label: 'Ask the agent',
    /* This one never leaves the agent: it is asked, and it goes and does it. */
    open: () => { state.view = 'agents'; },
    steps: () => [
      pause(1200),
      write(one('[data-editor="agent"]'), 'Clear what is low priority in my threads'),
      pause(400),
      click(one('.composer[data-size="large"] .send')),
      pause(9000),
    ],
  },
];

/* ── the cursor ──────────────────────────────────────────────────────────── */
function makeCursor() {
  const el = document.createElement('div');
  el.className = 'cursor';
  el.innerHTML = `
    <span class="cursorRing"></span>
    <svg viewBox="0 0 22 22" width="26" height="26" aria-hidden="true">
      <path d="M5 2.4 17.4 11.2l-5.3.55-2.7 5.05z" fill="#fff" stroke="#22242a" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>`;
  return el;
}

/* Window coordinates, undoing the scale the frame applies to everything in it. */
function pointAt(el) {
  const win = app.getBoundingClientRect();
  const k = win.width / app.offsetWidth || 1;
  const r = el.getBoundingClientRect();
  return {
    x: (r.left + r.width / 2 - win.left) / k,
    y: (r.top + r.height / 2 - win.top) / k,
  };
}

function placeCursor(el) {
  const { x, y } = pointAt(el);
  cursorEl.style.setProperty('--cx', `${Math.round(x)}px`);
  cursorEl.style.setProperty('--cy', `${Math.round(y)}px`);
  cursorEl.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
}

const sleep = (ms) => new Promise((done) => setTimeout(done, ms));

/*
 * Bring a target into view before the cursor goes for it.
 *
 * Sending a message scrolls a stream to the newest thing in it, so the message
 * a thread is *about* is then somewhere above the fold — and a pointer clicking
 * a control nobody can see reads as a bug rather than as a demo.
 */
function reveal(el) {
  const box = el.closest('.scroll, .listScroll, .agentScroll, .sideScroll');
  if (!box) return false;
  const outer = box.getBoundingClientRect();
  const inner = el.getBoundingClientRect();
  if (inner.top >= outer.top + 8 && inner.bottom <= outer.bottom - 8) return false;
  box.scrollTop += (inner.top - outer.top) - 24;
  if (box.dataset.scroll) scrollTops[box.dataset.scroll] = box.scrollTop;
  return true;
}

/* ── running one ─────────────────────────────────────────────────────────── */
function clearHover() {
  app.querySelectorAll('[data-demo-hover]').forEach((n) => n.removeAttribute('data-demo-hover'));
}

async function doStep(step, token) {
  if (token.cancelled) return;

  if (step.kind === 'wait') { await sleep(step.ms); return; }

  if (step.kind === 'type') {
    const editor = step.target.find();
    if (!editor) { console.warn('[demo] nothing to write into', step); return; }
    if (reveal(editor)) await sleep(300);
    if (token.cancelled) return;
    placeCursor(editor);
    await sleep(MOVE_MS);
    if (token.cancelled) return;
    editor.focus();
    const isField = editor.tagName === 'INPUT';
    /* A space before the next run, unless the box is empty or already ends in one. */
    const existing = isField ? editor.value : (editor.innerText || '');
    if (existing && !/\s$/.test(existing)) {
      if (isField) editor.value += ' ';
      else document.execCommand('insertText', false, ' ');
    }
    for (const ch of step.text) {
      if (token.cancelled) return;
      if (isField) editor.value += ch;
      else document.execCommand('insertText', false, ch);
      editor.dispatchEvent(new InputEvent('input', { bubbles: true }));
      await sleep(TYPE_MS);
    }
    return;
  }

  const el = step.target.find();
  /*
   * A step whose target is not on screen means the app moved and the demo did
   * not. Skipping it quietly would leave a reel that half-works; say so.
   */
  if (!el) { console.warn('[demo] step target missing', step); return; }

  if (reveal(el)) await sleep(340);
  if (token.cancelled) return;

  placeCursor(el);
  await sleep(MOVE_MS);
  if (token.cancelled) return;

  if (step.kind === 'hover') {
    clearHover();
    el.setAttribute('data-demo-hover', '');
    await sleep(120);
    return;
  }

  cursorEl.setAttribute('data-press', '');
  await sleep(CLICK_MS);
  cursorEl.removeAttribute('data-press');
  if (token.cancelled) return;

  /* A typeahead row answers to mousedown; everything else to a click. */
  if (el.dataset.mention) el.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
  else el.click();

  await sleep(SETTLE_MS);
}

function paintChapters() {
  chaptersEl.innerHTML = CHAPTERS.map((ch, i) => `
    <button class="chapter" type="button" role="tab" data-chapter="${i}" aria-selected="${i === chapter}">
      <span class="chapterTrack"><span class="chapterFill"></span></span>
      <span class="chapterLabel">${esc(ch.label)}</span>
    </button>`).join('');
}

let fillAnim = null;

function fillBar(index, ms) {
  if (fillAnim) fillAnim.cancel();
  chaptersEl.querySelectorAll('.chapterFill').forEach((bar, i) => {
    bar.style.transform = i < index ? 'scaleX(1)' : 'scaleX(0)';
  });
  const active = chaptersEl.querySelector(`[data-chapter="${index}"] .chapterFill`);
  if (!active || REDUCED) return;
  fillAnim = active.animate(
    [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }],
    { duration: ms, easing: 'linear', fill: 'forwards' },
  );
}

async function play(index) {
  if (run) run.cancelled = true;
  const token = { cancelled: false };
  run = token;
  chapter = index;

  const ch = CHAPTERS[index];

  /* Every chapter starts from the same workspace, so nothing carries over. */
  clearTimers();
  state = initialState();
  ch.open();
  render();
  clearHover();

  paintChapters();
  const steps = ch.steps();
  fillBar(index, steps.reduce((sum, step) => sum + stepCost(step), 0));

  const first = app.querySelector('.canvas');
  if (first) placeCursor(first);

  for (const step of steps) {
    if (token.cancelled) return;
    await doStep(step, token);
  }
  if (token.cancelled) return;

  clearHover();
  play((index + 1) % CHAPTERS.length);
}

chaptersEl.addEventListener('click', (event) => {
  const hit = event.target.closest('[data-chapter]');
  if (hit) play(Number(hit.dataset.chapter));
});

function startDemo() {
  app.setAttribute('data-driven', '');
  cursorEl = makeCursor();
  app.appendChild(cursorEl);
  paintChapters();
  play(0);
}

/* ══════════════════════════════════════════════════════════════════════════
   Fitting the window to whatever room the frame has.
   ══════════════════════════════════════════════════════════════════════════ */
const scaler = document.getElementById('scaler');
const artEl = document.querySelector('.art');
const stageEl = document.querySelector('.stage');
const heroEl = document.querySelector('.hero');
const copyEl = document.querySelector('.copy');

/* How large the app is drawn before scaling, and how far the scale may go. */
const BASE_WIDTH = { wide: 1120, stacked: 780 };
const SCALE_MAX = 1.2;
const WIN_H_MIN = 460;
/* A window is wider than it is tall. Past this the mock stops reading as a
   desktop app and starts reading as a phone drawn at desktop type sizes. */
const WIN_ASPECT_MAX = 1.15;

function fit() {
  /*
   * Nothing to fit into yet — a hidden pane, a tab that has never been painted.
   * Measuring it would collapse the window and leave it collapsed until
   * something else happened to fire this.
   */
  if (heroEl.clientWidth <= 0 || heroEl.clientHeight <= 0) return;

  const stacked = window.innerWidth <= 1080;
  const w = stacked ? BASE_WIDTH.stacked : BASE_WIDTH.wide;
  if (stacked) app.setAttribute('data-compact', ''); else app.removeAttribute('data-compact');

  const style = getComputedStyle(artEl);
  const padX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
  const padY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);

  /*
   * Both budgets are read off the row the frame sits in, never off the frame
   * itself: the frame hugs the window, so measuring it to decide how big the
   * window should be is how a fit routine oscillates. The track widths are the
   * used values the grid resolved, which no amount of scaling can change.
   */
  const tracks = getComputedStyle(heroEl).gridTemplateColumns.split(' ').map(parseFloat);
  const gap = parseFloat(getComputedStyle(heroEl).rowGap) || 0;
  const availW = Math.max(0, tracks[tracks.length - 1] - padX);

  /* The chapters and their caption sit under the frame and are not scaled, so
     their height comes off the budget before the window is sized to it. */
  const stageGap = parseFloat(getComputedStyle(stageEl).rowGap) || 0;
  const under = chaptersEl.offsetHeight + stageGap;
  const availH = Math.max(0, heroEl.clientHeight - (stacked ? copyEl.offsetHeight + gap : 0) - under - padY);
  if (availW <= 0 || availH <= 0) return;

  /*
   * The scale comes from the width, and the window's *height* then comes from
   * whatever room is left — so the frame is filled rather than letterboxed,
   * and a taller page simply shows more of the conversation. Only when the
   * room is too short for a window worth showing does the scale give way.
   */
  let k = Math.min(availW / w, SCALE_MAX);
  let h = availH / k;
  if (h < WIN_H_MIN) { h = WIN_H_MIN; k = availH / WIN_H_MIN; }
  h = Math.min(h, w * WIN_ASPECT_MAX);

  app.style.setProperty('--win-w', `${Math.round(w)}px`);
  app.style.setProperty('--win-h', `${Math.round(h)}px`);
  app.style.setProperty('--k', k.toFixed(4));
  scaler.style.width = `${w * k}px`;
  scaler.style.height = `${h * k}px`;
}

const ro = new ResizeObserver(() => fit());
ro.observe(heroEl);
window.addEventListener('resize', fit);

render();
fit();
startDemo();

})();
</script>

</body>
