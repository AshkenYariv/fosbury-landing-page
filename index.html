<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fosbury</title>
<meta name="description" content="The communication layer for teams that build. Every conversation gets an owner, a priority, and an end.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;510;600;620;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 150'%3E%3Cg fill='none' stroke='%23201C18' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M79 27 C75 15 61 10 53 18 C46 25 45 36 45 48 C45 72 43 93 41 110 C39 126 33 139 22 137 C12 135 11 121 26 112 C43 102 66 93 86 80'/%3E%3Cpath d='M6 108 H104'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   Tokens.

   The block below is the product's own `styles/tokens.css`, light theme only,
   trimmed to what this page draws. The mock is the app, so it is painted with
   the app's values rather than with approximations of them.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --font-family-app:'Inter',system-ui,-apple-system,sans-serif;
  --text-size-mini:10px;
  --text-size-micro:11px;
  --text-size-small:12px;
  --text-size-regular:13px;
  --text-size-medium:14px;
  --text-size-large:15px;
  --text-size-title:21px;
  --text-weight-regular:400;
  --text-weight-medium:500;
  --text-weight-heading:510;
  --text-weight-bold:620;
  --line-height-ui:1.45;
  --line-height-reading:1.65;

  --surface-chrome:#f4f4f5;
  --surface-canvas:#ffffff;
  --surface-raised:#ffffff;
  --surface-subtle:rgb(0 0 0 / .035);
  --surface-hover:rgb(0 0 0 / .045);
  --surface-hover-strong:rgb(0 0 0 / .09);
  --surface-selected:rgb(0 0 0 / .068);
  --surface-sunken:rgb(0 0 0 / .055);
  --surface-scrim:rgb(20 20 22 / .28);

  --border-subtle:rgb(0 0 0 / .07);
  --border-strong:rgb(0 0 0 / .12);

  --text-primary:#282a30;
  --text-secondary:#4b4e55;
  --text-tertiary:#8a8f98;
  --text-quaternary:#a8abb2;

  --icon-default:#6b6f76;
  --icon-tertiary:#8a8f98;

  --accent:#5e6ad2;
  --focus-ring:rgb(94 106 210 / .55);
  --danger:#eb5757;

  --status-open:#8a8f98;
  --status-resolved:#3a8f68;
  --status-closed:#a4abb3;

  --priority-urgent:#e07b3c;

  --identity-gray:#6b7280;
  --identity-purple:#6a5bd0;
  --identity-blue:#3b7ad4;
  --identity-teal:#1c8c96;
  --identity-green:#2f8b62;
  --identity-yellow:#a3781f;
  --identity-orange:#bd6c39;
  --identity-red:#c2524f;
  --identity-pink:#bb5589;
  --identity-wash:12%;

  --unread:#5f95e4;
  --unread-wash:14%;
  --favorite:#e2a03f;

  --reaction-acknowledged:var(--identity-teal);
  --reaction-agree:var(--identity-green);
  --reaction-disagree:var(--identity-red);
  --reaction-done:var(--status-resolved);
  --reaction-question:var(--identity-purple);
  --reaction-thanks:var(--identity-yellow);

  --topic-type-dev:#a3781f;
  --topic-type-ask:#0f8a97;
  --topic-type-general:#6b7280;
  --topic-type-sync:#b8508c;
  --topic-type-broadcast:#5b53cf;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:48px;

  --radius-small:4px; --radius-medium:6px; --radius-large:8px;
  --radius-canvas:10px; --radius-pill:999px;

  --row-height-compact:28px;
  --row-height-default:32px;
  --row-height-issue:36px;
  --row-height-table:40px;
  --icon-size-prominent:16px;

  --sidebar-width:244px;
  --utilitybar-height:34px;
  --titlebar-height:38px;
  --content-max-width:780px;
  --duration-panel:180ms;
  --ease-panel:cubic-bezier(.32,.72,0,1);

  --shadow-canvas:0 0 0 1px rgb(0 0 0 / .055), 0 1px 2px rgb(0 0 0 / .04);
  --shadow-menu:0 0 0 1px rgb(0 0 0 / .06), 0 12px 32px -12px rgb(0 0 0 / .32);
  --shadow-modal:0 0 0 1px rgb(0 0 0 / .06), 0 24px 60px -20px rgb(0 0 0 / .34);
}

/* Domain value → token. Copied from the product: nothing below names a colour. */
[data-identity-color='gray']{--identity:var(--identity-gray)}
[data-identity-color='purple']{--identity:var(--identity-purple)}
[data-identity-color='blue']{--identity:var(--identity-blue)}
[data-identity-color='teal']{--identity:var(--identity-teal)}
[data-identity-color='green']{--identity:var(--identity-green)}
[data-identity-color='yellow']{--identity:var(--identity-yellow)}
[data-identity-color='orange']{--identity:var(--identity-orange)}
[data-identity-color='red']{--identity:var(--identity-red)}
[data-identity-color='pink']{--identity:var(--identity-pink)}

[data-status='open']{--status:var(--status-open)}
[data-status='resolved']{--status:var(--status-resolved)}
[data-status='closed']{--status:var(--status-closed)}

[data-priority='urgent']{--priority:var(--priority-urgent)}
[data-priority='high']{--priority:var(--icon-default)}
[data-priority='medium']{--priority:var(--icon-default)}
[data-priority='low']{--priority:var(--icon-default)}
[data-priority='none']{--priority:var(--icon-tertiary)}

[data-reaction='acknowledged']{--reaction:var(--reaction-acknowledged)}
[data-reaction='agree']{--reaction:var(--reaction-agree)}
[data-reaction='disagree']{--reaction:var(--reaction-disagree)}
[data-reaction='done']{--reaction:var(--reaction-done)}
[data-reaction='question']{--reaction:var(--reaction-question)}
[data-reaction='thanks']{--reaction:var(--reaction-thanks)}

[data-topic-type='dev']{--topic-type:var(--topic-type-dev)}
[data-topic-type='ask']{--topic-type:var(--topic-type-ask)}
[data-topic-type='general']{--topic-type:var(--topic-type-general)}
[data-topic-type='sync']{--topic-type:var(--topic-type-sync)}
[data-topic-type='broadcast']{--topic-type:var(--topic-type-broadcast)}

/* ══════════════════════════════════════════════════════════════════════════
   The page.
   ══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  /* Plain white, as the ticket asks. The chrome grey belongs to the app, not the page. */
  background:#fff;
  color:var(--text-primary);
  font-family:var(--font-family-app);
  font-size:var(--text-size-regular);
  line-height:var(--line-height-ui);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
svg{display:block}
button{appearance:none;border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,p{margin:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:var(--radius-small)}

.page{
  height:100dvh;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  --gut:clamp(20px,3.2vw,48px);
  padding:clamp(16px,2.4vh,26px) var(--gut) clamp(18px,3vh,38px);
  /* The frame grows to fill this row, so the bar above it needs a gap of its
     own or the two end up sharing an edge. */
  row-gap:clamp(12px,2.2vh,26px);
  overflow:hidden;
}

/* ── top bar ─────────────────────────────────────────────────────────────── */
.top{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:var(--space-4);
  flex:none;
}
.brand{display:inline-flex;align-items:center;gap:10px;justify-self:start}
.mark{height:clamp(24px,2.6vw,30px);width:auto;color:var(--text-primary);overflow:visible}
.wordmark{
  font-size:clamp(19px,2vw,23px);
  font-weight:700;
  letter-spacing:-.035em;
  line-height:1;
  color:var(--text-primary);
  opacity:0;
  animation:rise .7s 1.05s cubic-bezier(.2,.7,.2,1) forwards;
}
.nav{display:flex;align-items:center;gap:var(--space-2);justify-self:center}
.navLink{
  display:inline-flex;align-items:center;
  height:36px;padding:0 var(--space-4);
  border-radius:var(--radius-pill);
  color:var(--text-secondary);
  font-size:clamp(14px,1.1vw,15px);
  font-weight:var(--text-weight-medium);
}
.navLink:hover{background:var(--surface-hover);color:var(--text-primary)}
.openApp{
  justify-self:end;
  display:inline-flex;align-items:center;
  height:40px;padding:0 var(--space-5);
  border-radius:var(--radius-pill);
  background:var(--text-primary);
  color:#fff;
  font-size:clamp(14px,1.1vw,15px);
  font-weight:var(--text-weight-medium);
  letter-spacing:-.005em;
  transition:background .16s ease;
}
.openApp:hover{background:#3d4048}
.top .nav,.top .openApp{opacity:0;animation:rise .7s 1.15s cubic-bezier(.2,.7,.2,1) forwards}

/* ── the two halves ──────────────────────────────────────────────────────── */
.hero{
  display:grid;
  grid-template-columns:minmax(300px,0.95fr) minmax(0,1.5fr);
  align-items:center;
  gap:clamp(22px,2.6vw,40px);
  min-height:0;
}
.copy{
  min-width:0;
  opacity:0;
  animation:rise .8s 1.25s cubic-bezier(.2,.7,.2,1) forwards;
}
/* The claim, and the one line that says what it means. */
.headline{
  font-size:clamp(30px,3.1vw,50px);
  font-weight:600;
  letter-spacing:-.035em;
  line-height:1.06;
  color:var(--text-primary);
  text-wrap:balance;
}
.subline{
  margin-top:clamp(12px,1.6vh,20px);
  /* One line. It is a single clause and breaking it mid-list reads as two. */
  font-size:clamp(13px,1.04vw,17px);
  font-weight:var(--text-weight-regular);
  letter-spacing:-.01em;
  line-height:1.5;
  /* Secondary rather than tertiary: this is a sentence to read, and the muted
     grey the app uses for a timestamp does not carry 17px of prose on white. */
  color:var(--text-secondary);
  text-wrap:balance;
}
@media(max-width:1080px){.subline{margin-inline:auto}}

/* ── the frame ───────────────────────────────────────────────────────────── */
/*
 * The painting is a mount, not a backdrop: it sits close around the window
 * rather than spreading behind it, so the app stays the subject.
 */
.art{
  position:relative;
  display:grid;
  place-items:center;
  align-self:center;
  justify-self:center;
  min-width:0;min-height:0;
  padding:clamp(12px,1.5vw,26px);
  border-radius:clamp(16px,1.6vw,26px);
  background:#8fb3c9 url('assets/wheatfield-with-cypresses.jpg') center/cover no-repeat;
  box-shadow:0 1px 2px rgb(0 0 0 / .06), 0 24px 60px -28px rgb(0 0 0 / .38);
  overflow:hidden;
  opacity:0;
  animation:rise .9s 1.35s cubic-bezier(.2,.7,.2,1) forwards;
}
/* The scaler is the window's footprint *after* scaling; the window itself is
   drawn once at a fixed size and scaled from its top-left corner into it. So a
   13px row stays a 13px row in the same proportion at every viewport, and the
   frame never has to reflow the app to fit it. */
.artScaler{position:relative}

/* ── the stage: the frame, the chapters under it, and the line under those ── */
.stage{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(12px,1.8vh,20px);
  min-width:0;min-height:0;height:100%;
}
.chapters{
  display:flex;align-items:stretch;gap:clamp(6px,.9vw,14px);flex:none;max-width:100%;
  opacity:0;animation:rise .9s 1.5s cubic-bezier(.2,.7,.2,1) forwards;
}
.chapter{
  position:relative;
  display:flex;flex-direction:column;gap:8px;
  flex:0 1 auto;min-width:0;padding:0;
  color:var(--text-quaternary);
  font-size:clamp(12px,.92vw,13.5px);font-weight:var(--text-weight-medium);
  letter-spacing:-.01em;text-align:left;white-space:nowrap;
  transition:color .2s ease;
}
.chapter:hover{color:var(--text-secondary)}
.chapter[aria-selected='true']{color:var(--text-primary)}
.chapterTrack{
  display:block;height:2px;width:clamp(66px,7.2vw,116px);
  border-radius:var(--radius-pill);background:rgb(0 0 0 / .1);overflow:hidden;
}
.chapterFill{
  display:block;height:100%;width:100%;
  border-radius:inherit;background:var(--text-primary);
  transform-origin:left center;transform:scaleX(0);
}
/* The bar fills over the chapter it belongs to and empties the moment it ends. */
.chapter[aria-selected='true'] .chapterFill{transition:transform linear}

/* ── the cursor that drives it ───────────────────────────────────────────── */
/*
 * Deliberately larger and softer than a real pointer, so nobody spends a second
 * wondering whether their own mouse has got away from them.
 */
.cursor{
  position:absolute;z-index:90;
  top:0;left:0;width:26px;height:26px;
  margin:-3px 0 0 -3px;
  pointer-events:none;
  filter:drop-shadow(0 2px 5px rgb(0 0 0 / .3));
  transition:transform .42s cubic-bezier(.33,.72,.24,1);
}
.cursor[data-press]{transform:translate(var(--cx),var(--cy)) scale(.82)}
.cursorRing{
  position:absolute;top:-9px;left:-9px;width:40px;height:40px;
  border-radius:var(--radius-pill);
  background:rgb(94 106 210 / .3);
  opacity:0;transform:scale(.35);
}
.cursor[data-press] .cursorRing{animation:tap .42s ease-out}
@keyframes tap{0%{opacity:.85;transform:scale(.3)}100%{opacity:0;transform:scale(1)}}

/* The window is a display while the demo runs; the cursor clicks it, not you. */
.win[data-driven]{pointer-events:none}
/* A pointer that is not real still has to raise what a real one would. */
.msg[data-demo-hover] .tools{display:flex}

@media(prefers-reduced-motion:reduce){
  .cursor{transition:none}
  .cursor[data-press] .cursorRing{animation:none}
  .chapter[aria-selected='true'] .chapterFill{transition:none}
}

/* ══════════════════════════════════════════════════════════════════════════
   The app, in a window.
   ══════════════════════════════════════════════════════════════════════════ */
.win{
  position:absolute;
  top:0;left:0;
  width:var(--win-w,1120px);
  height:var(--win-h,760px);
  transform:scale(var(--k,1));
  transform-origin:top left;
  display:flex;
  flex-direction:column;
  border-radius:12px;
  background:var(--surface-chrome);
  box-shadow:0 0 0 1px rgb(0 0 0 / .1), 0 30px 60px -20px rgb(0 0 0 / .45);
  overflow:hidden;
  font-size:var(--text-size-regular);
  color:var(--text-secondary);
  line-height:var(--line-height-ui);
}
/*
 * The title bar is the shell's own grid, so the tab strip begins exactly where
 * the canvas does rather than trailing the traffic lights.
 */
.winBar{
  display:grid;
  grid-template-columns:var(--sidebar-width) minmax(0,1fr);
  align-items:center;
  flex:none;height:var(--titlebar-height);
}
.lights{display:inline-flex;align-items:center;gap:8px;flex:none;padding-left:var(--space-3)}
.light{width:12px;height:12px;border-radius:var(--radius-pill)}
.light[data-l='r']{background:#ff5f57}
.light[data-l='y']{background:#febc2e}
.light[data-l='g']{background:#28c840}
.winTab{
  display:inline-flex;align-items:center;gap:var(--space-2);
  width:200px;height:var(--row-height-compact);
  padding:0 var(--space-2);
  border-radius:var(--radius-medium);
  background:var(--surface-canvas);
  box-shadow:var(--shadow-canvas);
  color:var(--text-primary);
  font-size:var(--text-size-small);
  font-weight:var(--text-weight-medium);
  min-width:0;
}
.win[data-compact] .winBar{grid-template-columns:auto minmax(0,1fr);gap:var(--space-3)}
.winBody{
  display:grid;
  grid-template-columns:var(--sidebar-width) minmax(0,1fr);
  flex:1;min-height:0;
}
.win[data-compact] .winBody{grid-template-columns:minmax(0,1fr)}
.win[data-compact] .side{display:none}
.canvas{
  display:flex;flex-direction:column;
  min-width:0;min-height:0;
  margin-right:var(--space-2);
  border-radius:var(--radius-canvas);
  background:var(--surface-canvas);
  box-shadow:var(--shadow-canvas);
  overflow:hidden;
}
.utilityBar{
  display:flex;align-items:center;justify-content:flex-end;
  flex:none;height:var(--utilitybar-height);padding:0 var(--space-3);
  gap:var(--space-1);
}
.utilityChip{
  display:inline-flex;align-items:center;gap:var(--space-2);
  height:var(--row-height-compact);padding:0 var(--space-2);
  border-radius:var(--radius-medium);
  color:var(--text-tertiary);font-size:var(--text-size-small);white-space:nowrap;
}
.utilityChip:hover{background:var(--surface-hover);color:var(--text-primary)}

/* ── sidebar ─────────────────────────────────────────────────────────────── */
.side{
  display:flex;flex-direction:column;gap:var(--space-1);
  min-height:0;padding:0 var(--space-2) var(--space-2);
}
.sideHeader{display:flex;align-items:center;gap:var(--space-1);flex:none;height:var(--row-height-default)}
.workspace{
  display:flex;align-items:center;gap:var(--space-2);flex:1;
  height:var(--row-height-default);padding:0 var(--space-2) 0 var(--space-1);
  border-radius:var(--radius-medium);
  color:var(--text-primary);font-weight:var(--text-weight-medium);min-width:0;
}
.workspace:hover{background:var(--surface-hover)}
.workspaceName{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconBtn{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:var(--row-height-compact);height:var(--row-height-compact);
  border-radius:var(--radius-medium);color:var(--icon-default);
}
.iconBtn:hover{background:var(--surface-hover);color:var(--text-primary)}
.sideScroll{
  display:flex;flex-direction:column;gap:var(--space-5);
  flex:1;min-height:0;overflow-y:auto;
  padding-top:var(--space-3);padding-bottom:var(--space-4);
}
.sideGroup{display:flex;flex-direction:column}
/* A section head is the control that folds the section: same row, same hover. */
.sideLabel{
  display:flex;align-items:center;gap:var(--space-2);
  width:100%;height:var(--row-height-default);padding:0 var(--space-2);
  border-radius:var(--radius-medium);
  color:var(--text-tertiary);font-size:var(--text-size-small);text-align:left;
}
.sideLabel:hover{background:var(--surface-hover);color:var(--text-secondary)}
.sideChevron{display:inline-flex;flex:none;color:var(--icon-tertiary);transition:transform var(--duration-panel) ease}
.sideLabel[aria-expanded='false'] .sideChevron{transform:rotate(-90deg)}
.row{
  display:flex;align-items:center;gap:var(--space-2);
  width:100%;height:var(--row-height-default);
  padding-left:var(--space-2);padding-right:var(--space-2);
  border-radius:var(--radius-medium);
  color:var(--text-secondary);font-size:var(--text-size-regular);
  min-width:0;text-align:left;
}
.row:hover{background:var(--surface-hover);color:var(--text-primary)}
.row[data-active]{background:var(--surface-selected);color:var(--text-primary);font-weight:var(--text-weight-medium)}
.rowMark{flex:none;color:var(--identity,var(--icon-default))}
.row[data-active] .rowMark{color:var(--identity,var(--accent))}
.rowLabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowTrailing{
  flex:none;color:var(--text-tertiary);
  font-size:var(--text-size-micro);font-variant-numeric:tabular-nums;
}
.rowNested{padding-left:var(--space-4)}

/* ── page header inside the canvas ───────────────────────────────────────── */
.pageHeader{display:flex;flex-direction:column;flex:none}
.pathRow{
  display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;
  min-height:var(--row-height-table);padding:var(--space-2) var(--space-3) 0;
}
.crumbs{display:flex;align-items:center;min-width:0}
.crumb{
  display:inline-flex;align-items:center;gap:var(--space-2);
  height:var(--row-height-compact);padding:0 var(--space-2);
  border-radius:var(--radius-medium);
  color:var(--text-tertiary);font-size:var(--text-size-regular);white-space:nowrap;
}
button.crumb:hover{background:var(--surface-hover);color:var(--text-primary)}
.crumb[data-last]{color:var(--text-primary);font-weight:var(--text-weight-medium)}
.crumbSep{color:var(--text-quaternary);padding:0 2px;font-size:var(--text-size-regular)}
.crumbMark{flex:none;color:var(--topic-type,var(--icon-tertiary))}
.favBtn{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:var(--row-height-compact);height:var(--row-height-compact);
  border-radius:var(--radius-small);color:var(--icon-tertiary);
}
.favBtn:hover{background:var(--surface-hover);color:var(--text-primary)}
.favBtn[data-on]{color:var(--favorite)}
.members{flex:none;color:var(--text-tertiary);font-size:var(--text-size-small)}
.headerActions{display:flex;align-items:center;gap:var(--space-1);flex:none;margin-left:auto}
.filterRow{
  display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap;
  min-height:var(--row-height-issue);padding:0 var(--space-3) var(--space-1);
}
.searchBox{
  display:inline-flex;align-items:center;gap:var(--space-2);
  flex:0 1 180px;min-width:108px;height:var(--row-height-compact);
  padding:0 var(--space-3);border-radius:var(--radius-pill);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
}
.searchBox svg{color:var(--icon-tertiary);flex:none}
.searchBox input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:var(--text-size-small)}
.searchBox input::placeholder{color:var(--text-quaternary)}
.pill{
  display:inline-flex;align-items:center;gap:var(--space-2);flex:none;
  height:var(--row-height-compact);padding:0 var(--space-3);
  border-radius:var(--radius-pill);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
  color:var(--text-secondary);font-size:var(--text-size-small);white-space:nowrap;
}
.pill:hover{box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--text-primary)}
.pill[aria-pressed='true'],.pill[aria-pressed='true']:hover{
  background:var(--surface-selected);box-shadow:inset 0 0 0 1px transparent;
  color:var(--text-primary);font-weight:var(--text-weight-medium);
}
.pill[data-muted]{color:var(--text-tertiary);cursor:default}
.spacer{flex:1;min-width:var(--space-2)}

/* ── identity marks ──────────────────────────────────────────────────────── */
.mk{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  border-radius:var(--radius-pill);
  background:color-mix(in srgb, var(--identity,var(--identity-gray)) var(--identity-wash), transparent);
  color:var(--identity,var(--identity-gray));
  font-weight:var(--text-weight-medium);letter-spacing:.02em;line-height:1;
  overflow:hidden;
}
.mk[data-size='small']{width:var(--icon-size-prominent);height:var(--icon-size-prominent);font-size:var(--text-size-mini);letter-spacing:0}
.mk[data-size='mark']{width:var(--space-5);height:var(--space-5);font-size:var(--text-size-mini)}
.mk[data-size='large']{width:var(--space-6);height:var(--space-6);font-size:var(--text-size-micro)}
.mkStack{display:inline-flex;align-items:center;flex:none;padding-left:var(--space-1)}
.mkStack>.mk{
  margin-left:calc(var(--space-1) * -1);
  background:color-mix(in srgb, var(--identity,var(--identity-gray)) var(--identity-wash), var(--surface-canvas));
  box-shadow:0 0 0 2px var(--surface-canvas);
}
.mkOverflow{
  margin-left:var(--space-1);
  color:var(--text-quaternary);font-size:var(--text-size-mini);font-variant-numeric:tabular-nums;
}

/* ── messages ────────────────────────────────────────────────────────────── */
.stream{display:flex;flex-direction:column;min-width:0;min-height:0}
.chatBody{
  display:grid;flex:1;min-width:0;min-height:0;overflow:hidden;
  --panel-width:380px;
  grid-template-columns:minmax(0,1fr) 0px;
  transition:grid-template-columns var(--duration-panel) var(--ease-panel);
}
.chatBody[data-panel='open']{grid-template-columns:minmax(0,1fr) var(--panel-width)}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:var(--space-2)}
/* A room that has not filled its height still reads from the bottom up: the
   newest thing said sits against the composer, not adrift under the header. */
.scroll[data-anchor='bottom']{display:flex;flex-direction:column}
.scroll[data-anchor='bottom'] > .messages{margin-top:auto}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:rgb(0 0 0 / .13);border-radius:var(--radius-pill);border:2px solid transparent;background-clip:content-box}
.messages{display:flex;flex-direction:column;gap:2px;width:100%}
.msg{
  position:relative;display:flex;align-items:flex-start;gap:var(--space-3);
  padding:var(--space-2) var(--space-3);border-radius:var(--radius-medium);
}
.msgBody{flex:1;padding-right:var(--space-3);min-width:0}
.byline{display:flex;align-items:baseline;gap:var(--space-2)}
.author{color:var(--text-primary);font-size:var(--text-size-regular);font-weight:var(--text-weight-medium)}
.time{color:var(--text-quaternary);font-size:var(--text-size-micro);font-variant-numeric:tabular-nums}
.text{color:var(--text-secondary);font-size:var(--text-size-medium);line-height:var(--line-height-reading)}
.text strong{font-weight:var(--text-weight-bold);color:var(--text-primary)}
.mention{
  display:inline-flex;align-items:baseline;gap:var(--space-1);
  color:var(--text-primary);text-decoration:underline;text-decoration-color:var(--border-strong);
  text-underline-offset:2px;
}
.mention .mk{transform:translateY(2px)}
.refLink{
  display:inline;color:var(--text-primary);
  text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:2px;
}
.refIcon{display:inline-flex;transform:translateY(2px);color:var(--icon-tertiary);margin-right:2px}
.topicRef{color:var(--text-tertiary)}
.topicRef svg{display:inline-block;vertical-align:-2px;color:var(--topic-type,var(--icon-tertiary))}
.marks{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1);margin-top:var(--space-2)}
.chip,.chipMine,.statusChip,.followChip{
  display:inline-flex;align-items:center;gap:var(--space-1);
  height:var(--space-5);padding:0 var(--space-2);
  border-radius:var(--radius-pill);
  font-size:var(--text-size-micro);font-variant-numeric:tabular-nums;
}
.chip{box-shadow:inset 0 0 0 1px var(--border-subtle);color:var(--text-tertiary)}
.chip:hover{background:var(--surface-hover-strong)}
.chipMine{box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.chipMine:hover{background:var(--surface-hover-strong)}
.chipMark{color:var(--reaction,currentColor);display:inline-flex}
.chipEmoji{font-size:var(--text-size-small);line-height:1}
.statusChip{
  background:color-mix(in srgb, var(--status) 14%, transparent);
  color:var(--status);font-weight:var(--text-weight-medium);
}
.statusChip:hover{background:color-mix(in srgb, var(--status) 22%, transparent)}
.assignChip{
  display:inline-flex;align-items:center;gap:var(--space-1);
  height:var(--space-5);padding:0 var(--space-2) 0 var(--space-1);
  border-radius:var(--radius-pill);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
  color:var(--text-tertiary);font-size:var(--text-size-micro);
}
.assignChip:hover{background:var(--surface-hover-strong);color:var(--text-primary)}
.followChip{box-shadow:inset 0 0 0 1px var(--border-subtle);color:var(--text-tertiary)}
.followChip:hover{background:var(--surface-hover-strong);color:var(--text-primary)}
.followChip[data-agentic]{color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent)}
.threadRow{display:flex;align-items:center;gap:var(--space-1);margin-top:var(--space-1);margin-left:calc(var(--space-2) * -1)}
.replies{
  display:inline-flex;align-items:center;gap:var(--space-2);
  height:var(--row-height-compact);padding:0 var(--space-2);
  border-radius:var(--radius-medium);
  color:var(--accent);font-size:var(--text-size-small);font-weight:var(--text-weight-medium);
}
.replies:hover{background:var(--surface-hover-strong)}
.tools{
  position:absolute;top:calc(var(--space-2) * -1);right:var(--space-2);
  display:none;align-items:center;gap:1px;padding:2px;
  border-radius:var(--radius-medium);
  background:var(--surface-raised);box-shadow:var(--shadow-canvas);
  z-index:5;
}
.msg:hover .tools,.msg[data-busy] .tools,.tools:focus-within{display:flex}
.tool{
  display:inline-flex;align-items:center;justify-content:center;
  width:var(--space-6);height:var(--space-6);
  border-radius:var(--radius-pill);color:var(--icon-default);
}
.tool:hover,.tool[aria-expanded='true']{background:var(--surface-hover-strong);color:var(--text-primary)}
.tool[data-status]{color:var(--status)}
.toolDivider{width:1px;height:14px;background:var(--border-subtle);margin:0 2px;flex:none}
.divider{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-3) var(--space-2)}
.dividerLabel{color:var(--text-quaternary);font-size:var(--text-size-micro);flex:none}
.divider::after{content:'';flex:1;height:1px;background:var(--border-subtle)}
.filteredNote{
  display:flex;align-items:center;gap:var(--space-2);
  padding:var(--space-2) var(--space-3);
  color:var(--text-quaternary);font-size:var(--text-size-micro);
}

/* ── thread panel ────────────────────────────────────────────────────────── */
.panel{
  display:flex;flex-direction:column;min-width:0;min-height:0;
  width:var(--panel-width);border-left:1px solid var(--border-subtle);
}
.panelHeader{
  display:flex;align-items:center;justify-content:flex-end;flex:none;
  height:var(--row-height-issue);padding:0 var(--space-2);
}
.panelClose{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:var(--row-height-compact);height:var(--row-height-compact);
  border-radius:var(--radius-medium);color:var(--icon-default);
}
.panelClose:hover{background:var(--surface-hover);color:var(--text-primary)}
.panelCount{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-2) var(--space-3);
  color:var(--text-tertiary);font-size:var(--text-size-micro);
}
.panelCount::after{content:'';flex:1;height:1px;background:var(--border-subtle)}

/* ── composer ────────────────────────────────────────────────────────────── */
.composer{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;
  align-items:center;flex:none;
  margin:var(--space-3);padding:var(--space-1);gap:var(--space-1);
  border-radius:var(--radius-pill);
  background:var(--surface-canvas);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
}
.composer:focus-within{box-shadow:inset 0 0 0 1px var(--border-strong)}
.composer[data-size='large']{padding:var(--space-2);gap:var(--space-2);margin:0}
.editor{
  min-width:0;max-height:96px;padding:var(--space-1) var(--space-2);
  overflow-y:auto;overscroll-behavior:contain;
  color:var(--text-primary);font-size:var(--text-size-medium);
  line-height:var(--line-height-ui);white-space:pre-wrap;word-break:break-word;
  outline:none;
}
.composer[data-size='large'] .editor{padding:var(--space-2)}
.editor[data-empty='true']::before{content:attr(data-placeholder);color:var(--text-quaternary);pointer-events:none}
.attach{
  display:inline-flex;align-items:center;justify-content:center;
  width:var(--row-height-compact);height:var(--row-height-compact);
  border-radius:var(--radius-pill);color:var(--icon-default);
}
.attach:hover{background:var(--surface-hover-strong);color:var(--text-primary)}
.properties{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--row-height-compact)}
.propBtn{
  display:inline-flex;align-items:center;justify-content:center;
  width:var(--space-6);height:var(--space-6);
  border-radius:var(--radius-medium);color:var(--icon-tertiary);
}
.propBtn:hover{background:var(--surface-hover-strong);color:var(--text-primary)}
.send{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:var(--row-height-compact);height:var(--row-height-compact);
  border-radius:var(--radius-pill);
  background:var(--text-primary);color:var(--surface-canvas);
}
.send:hover{background:var(--text-secondary)}
.send[disabled]{background:var(--surface-sunken);color:var(--text-quaternary);cursor:default}

/* ── the composer's mention typeahead ────────────────────────────────────── */
/*
 * Lifted from the product's `features/chat/Typeahead`. It is positioned and
 * updated by hand rather than through the render, because a re-render replaces
 * the box being typed in and takes the caret with it.
 */
.typeahead{
  position:absolute;z-index:70;
  display:flex;flex-direction:column;
  width:288px;max-height:232px;padding:var(--space-1);
  overflow-y:auto;overscroll-behavior:contain;
  border-radius:var(--radius-large);
  background:var(--surface-raised);box-shadow:var(--shadow-menu);
}
.typeaheadHeading{
  flex:none;padding:var(--space-1) var(--space-2);
  color:var(--text-quaternary);font-size:var(--text-size-micro);font-weight:var(--text-weight-medium);
}
.typeaheadOption{
  display:flex;align-items:center;gap:var(--space-2);flex:none;
  height:var(--row-height-default);padding:0 var(--space-2);
  border-radius:var(--radius-medium);
  color:var(--text-secondary);font-size:var(--text-size-regular);
}
.typeaheadOption[data-active]{background:var(--surface-selected);color:var(--text-primary)}
.typeaheadText{display:flex;align-items:baseline;gap:var(--space-2);min-width:0}
.typeaheadDetail{color:var(--text-quaternary);font-size:var(--text-size-small)}
/* A mention already made, sitting in the box you are still writing in. */
.mentionChip{
  display:inline-flex;align-items:baseline;gap:var(--space-1);
  color:var(--text-primary);font-weight:var(--text-weight-medium);
  text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:2px;
  white-space:nowrap;
}
.mentionChip .mk{transform:translateY(2px)}

/* ── menus and dialogs inside the window ─────────────────────────────────── */
.menu{
  position:absolute;z-index:60;
  min-width:172px;padding:var(--space-1);
  border-radius:var(--radius-large);
  background:var(--surface-raised);box-shadow:var(--shadow-menu);
}
.menuItem{
  display:flex;align-items:center;gap:var(--space-2);
  width:100%;height:var(--row-height-compact);
  padding:0 var(--space-2);border-radius:var(--radius-medium);
  color:var(--text-secondary);font-size:var(--text-size-regular);text-align:left;
}
.menuItem:hover{background:var(--surface-hover)}
.menuItem[data-on]{color:var(--text-primary)}
.menuMark{flex:none;display:inline-flex;color:var(--status,var(--priority,var(--icon-default)))}
.menuLabel{flex:1}
.menuCheck{flex:none;display:inline-flex;color:var(--icon-tertiary)}
.reactionMenu{display:flex;align-items:center;gap:2px;padding:var(--space-1);min-width:0}
.reactionOpt{
  display:inline-flex;align-items:center;justify-content:center;
  width:var(--space-6);height:var(--space-6);
  border-radius:var(--radius-medium);color:var(--reaction,var(--icon-default));
}
.reactionOpt:hover{background:var(--surface-hover)}

.scrim{
  position:absolute;inset:0;z-index:80;
  display:grid;place-items:center;
  background:var(--surface-scrim);
  border-radius:12px;
  padding:var(--space-6);
}
.dialog{
  width:min(560px,100%);
  border-radius:var(--radius-large);
  background:var(--surface-raised);box-shadow:var(--shadow-modal);
  overflow:hidden;
}
.dialogHead{
  display:flex;align-items:center;gap:var(--space-1);
  padding:var(--space-3) var(--space-4) 0;
  white-space:nowrap;overflow:hidden;
}
.dialogCrumb{color:var(--text-tertiary);font-size:var(--text-size-regular);min-width:0;overflow:hidden;text-overflow:ellipsis}
.dialogCrumb[data-last]{color:var(--text-primary);font-weight:var(--text-weight-medium)}
.dialogNote{padding:var(--space-3) var(--space-4) 0}
.dialogInput{
  width:100%;height:var(--row-height-default);
  padding:0 var(--space-3);
  border:0;outline:none;border-radius:var(--radius-medium);
  background:var(--surface-subtle);
  color:var(--text-primary);font-size:var(--text-size-regular);
}
.dialogInput::placeholder{color:var(--text-quaternary)}
.dialogInput:focus{box-shadow:inset 0 0 0 1px var(--border-strong)}
.dialogChips{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4) var(--space-4)}
.dialogChip{
  position:relative;
  display:inline-flex;align-items:center;gap:var(--space-2);
  height:var(--row-height-default);padding:0 var(--space-3);
  border-radius:var(--radius-medium);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
  color:var(--text-primary);font-size:var(--text-size-regular);
}
.dialogChip:hover,.dialogChip[aria-expanded='true']{box-shadow:inset 0 0 0 1px var(--border-strong)}
.dialogChip svg{color:var(--icon-tertiary);flex:none}
.dialogChip[data-agentic] svg{color:var(--accent)}
.dialogFoot{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) var(--space-4);
  border-top:1px solid var(--border-subtle);
}
.dialogHint{flex:1;color:var(--text-quaternary);font-size:var(--text-size-small)}
.btnGhost{
  display:inline-flex;align-items:center;height:var(--row-height-default);
  padding:0 var(--space-3);border-radius:var(--radius-medium);
  color:var(--text-secondary);font-size:var(--text-size-regular);
}
.btnGhost:hover{background:var(--surface-hover);color:var(--text-primary)}
.btnPrimary{
  display:inline-flex;align-items:center;height:var(--row-height-default);
  padding:0 var(--space-4);border-radius:var(--radius-medium);
  background:var(--text-primary);color:var(--surface-canvas);
  font-size:var(--text-size-regular);font-weight:var(--text-weight-medium);
}
.btnPrimary:hover{background:var(--text-secondary)}

/* ── list screens ────────────────────────────────────────────────────────── */
.listScroll{display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto;padding:0 var(--space-4) var(--space-6)}
.group{display:flex;flex-direction:column}
.groupHead{
  display:flex;align-items:center;gap:var(--space-2);
  height:var(--row-height-table);padding:0 var(--space-2);
  border-radius:var(--radius-medium);text-align:left;
}
.groupHead:hover{background:var(--surface-hover)}
.groupChevron{color:var(--icon-tertiary);flex:none;display:inline-flex;transition:transform var(--duration-panel) ease}
.groupHead[aria-expanded='false'] .groupChevron{transform:rotate(-90deg)}
.groupMark{color:var(--priority,var(--icon-default));flex:none;display:inline-flex}
.groupLabel{color:var(--text-primary);font-size:var(--text-size-regular);font-weight:var(--text-weight-medium)}
.groupCount{color:var(--text-quaternary);font-size:var(--text-size-small);font-variant-numeric:tabular-nums}
.groupRows{display:flex;flex-direction:column;padding-bottom:var(--space-4)}
.item{
  position:relative;display:flex;align-items:center;
  width:100%;height:var(--row-height-issue);
  padding-left:var(--space-2);border-radius:var(--radius-medium);
  text-align:left;
}
.item:hover{background:var(--surface-hover)}
/* A finished follow-up is still listed; it just stops asking for attention. */
.item[data-done] .itemTitle,.item[data-done] .itemPreview{color:var(--text-quaternary)}
.itemUnread{display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;margin-right:var(--space-1)}
.unreadBadge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:16px;padding:0 5px;border-radius:var(--radius-pill);
  background:color-mix(in srgb, var(--unread) var(--unread-wash), transparent);
  color:var(--unread);font-size:var(--text-size-mini);font-weight:var(--text-weight-medium);
  font-variant-numeric:tabular-nums;line-height:1;
}
.itemMarks{position:relative;display:flex;align-items:center;flex:none}
.itemMarkBtn{border-radius:var(--radius-medium);cursor:pointer}
.itemMarkBtn:hover,.itemMarkBtn[aria-expanded='true']{background:var(--surface-hover-strong)}
.itemMark{
  display:inline-flex;align-items:center;justify-content:center;
  width:var(--space-6);height:var(--space-6);
  color:var(--status,var(--priority,var(--icon-default)));
}
.itemMark[data-kind]{color:var(--topic-type,var(--icon-tertiary))}
.itemFace{display:flex;align-items:center;gap:var(--space-3);flex:1;height:100%;padding:0 var(--space-2);min-width:0;text-align:left}
.itemLead{display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--space-6)}
.itemTitle{
  flex:0 1 auto;min-width:0;max-width:320px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text-primary);font-size:var(--text-size-regular);font-weight:var(--text-weight-medium);
}
.itemPreview{
  flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text-quaternary);font-size:var(--text-size-regular);
}
.itemOpen{flex:none;width:60px;margin-left:auto;color:var(--text-tertiary);font-size:var(--text-size-micro);text-align:right}
.itemFaces{display:inline-flex;justify-content:flex-end;flex:none;width:88px}
.itemAvatar{display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--space-5);margin-left:auto}
.itemActivity{flex:none;width:40px;color:var(--text-quaternary);font-size:var(--text-size-micro);font-variant-numeric:tabular-nums;text-align:right}
.itemDue{flex:none;width:132px;font-size:var(--text-size-micro);text-align:right;color:var(--text-tertiary)}
.itemDue[data-overdue]{color:var(--priority-urgent);font-weight:var(--text-weight-medium)}
.emptyNote{
  display:flex;align-items:center;justify-content:center;
  flex:1;min-height:160px;
  color:var(--text-quaternary);font-size:var(--text-size-regular);
}
.itemCount{
  display:inline-flex;align-items:center;gap:var(--space-2);
  height:var(--row-height-compact);padding:0 var(--space-2);
  border-radius:var(--radius-medium);
  color:var(--text-tertiary);font-size:var(--text-size-small);white-space:nowrap;
}
.itemPeople{display:inline-flex;align-items:center;justify-content:flex-end;flex:none;width:168px;gap:var(--space-2)}
.itemTopics{display:inline-flex;align-items:center;justify-content:flex-end;flex:none;width:100px}

/* ── the agent ───────────────────────────────────────────────────────────── */
.agentCentred{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;padding:var(--space-4)}
.agentOpening{width:100%;max-width:620px;margin-bottom:var(--space-8)}
.greeting{
  padding:0 var(--space-3) var(--space-4);
  color:var(--text-primary);font-size:var(--text-size-title);
  font-weight:var(--text-weight-heading);letter-spacing:-.01em;
}
.suggestions{display:flex;flex-wrap:wrap;gap:var(--space-2);padding:var(--space-4) var(--space-3) 0}
.suggestion{
  height:var(--row-height-default);padding:0 var(--space-3);
  border-radius:var(--radius-pill);
  box-shadow:inset 0 0 0 1px var(--border-subtle);
  color:var(--text-tertiary);font-size:var(--text-size-small);text-align:left;
}
.suggestion:hover{background:var(--surface-hover);color:var(--text-primary)}
.conversation{display:flex;flex-direction:column;flex:1;min-height:0}
.agentScroll{flex:1;min-height:0;overflow-y:auto;padding:var(--space-4) var(--space-2)}
.turns{
  display:flex;flex-direction:column;gap:var(--space-5);
  width:100%;max-width:var(--content-max-width);margin:0 auto;
}
.agentComposerWrap{flex:none;width:100%;max-width:var(--content-max-width);margin:0 auto;padding:var(--space-3) 0 var(--space-3)}
.turnYou{
  align-self:flex-end;max-width:78%;
  padding:var(--space-2) var(--space-3);border-radius:var(--radius-large);
  background:var(--surface-subtle);color:var(--text-primary);font-size:var(--text-size-regular);
}
.turnAgent{display:flex;flex-direction:column;gap:var(--space-2);max-width:100%}
.activity{display:flex;align-items:center;gap:var(--space-2);color:var(--text-tertiary);font-size:var(--text-size-small)}
.pulse{
  width:6px;height:6px;flex:none;border-radius:var(--radius-pill);
  background:var(--text-tertiary);animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
.summary,.stepHead{
  display:inline-flex;align-items:center;gap:var(--space-1);align-self:flex-start;
  color:var(--text-tertiary);font-size:var(--text-size-small);
}
.summary:hover,.stepHead:hover{color:var(--text-secondary)}
.turnChevron{color:var(--icon-tertiary);display:inline-flex;transition:transform var(--duration-panel) ease}
[aria-expanded='true'] > .turnChevron{transform:rotate(90deg)}
.steps{
  display:flex;flex-direction:column;gap:var(--space-3);
  padding:0 0 var(--space-1) var(--space-3);
  border-left:1px solid var(--border-subtle);
}
.step{display:flex;flex-direction:column;gap:var(--space-1)}
.stepHeadPlain{color:var(--text-tertiary);font-size:var(--text-size-small)}
.reasoning{color:var(--text-quaternary);font-size:var(--text-size-small);line-height:var(--line-height-reading)}
.stepTool{display:flex;align-items:baseline;gap:var(--space-2);font-size:var(--text-size-small)}
.toolLabel{color:var(--text-tertiary)}
.toolDetail{color:var(--text-quaternary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.answer{display:flex;flex-direction:column;gap:var(--space-2);color:var(--text-primary)}
.paragraph{font-size:var(--text-size-regular);line-height:var(--line-height-reading)}
.bullets{
  display:flex;flex-direction:column;gap:var(--space-1);
  padding-left:var(--space-4);font-size:var(--text-size-regular);line-height:var(--line-height-reading);
  list-style:disc;
}

/* ── motion ──────────────────────────────────────────────────────────────── */
#script{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .95s .15s cubic-bezier(.55,.05,.35,1) forwards}
#crossbar{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .38s .95s cubic-bezier(.3,0,.15,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  #script,#crossbar{animation:none;stroke-dashoffset:0}
  .wordmark,.nav,.openApp,.copy,.art,.chapters{animation:none;opacity:1;transform:none}
  .chatBody{transition:none}
  .pulse{animation:none;opacity:.6}
}

/* ── the page on a narrower screen ───────────────────────────────────────── */
@media(max-width:1080px){
  .hero{grid-template-columns:minmax(0,1fr);align-content:center;gap:clamp(16px,2.4vh,28px)}
  .headline{font-size:clamp(26px,4.4vw,40px)}
  .copy{text-align:center}
}
@media(max-width:760px){
  .top{grid-template-columns:auto 1fr auto;gap:var(--space-2)}
  .nav{justify-self:center}
  .navLink{padding:0 var(--space-2)}
  .openApp{height:36px;padding:0 var(--space-4)}
}

let state = initialState();

/* ══════════════════════════════════════════════════════════════════════════
   Drawing.
   ══════════════════════════════════════════════════════════════════════════ */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const room = () => state.rooms[state.room];
const thread = (id) => state.threads[id];

function markFor(memberId, size = 'mark') {
  const p = PEOPLE[memberId];
  return `<span class="mk" data-size="${size}" data-identity-color="${p.color}" title="${esc(p.name)}">${esc(p.initials)}</span>`;
}

/* Three faces and a count: a row says who is in a room, not everyone in it. */
function faceStack(ids, total) {
  const shown = ids.slice(0, 3);
  const rest = (total || ids.length) - shown.length;
  return `<span class="mkStack">${shown.map((id) => markFor(id, 'mark')).join('')}${
    rest > 0 ? `<span class="mkOverflow">+${rest}</span>` : ''
  }</span>`;
}

function spanHtml(span) {
  if (span.mention) {
    const p = PEOPLE[span.mention];
    return `<span class="mention">${markFor(span.mention, 'small')}${esc(p.name)}</span>`;
  }
  if (span.ref) {
    return `<span class="refLink"><span class="refIcon">${icon(span.refIcon || 'thread', 'compact')}</span>${esc(span.ref)}</span>`;
  }
  if (span.topic) {
    return `<span class="topicRef" data-topic-type="${span.topicType}">${icon('type-' + span.topicType, 'compact')} ${esc(span.topic)}</span>`;
  }
  if (span.strong) return `<strong>${esc(span.text)}</strong>`;
  return esc(span.text);
}

/*
 * A room's priority, wherever it is read from.
 *
 * For the rooms this mock holds, the list row is a view onto the room, so the
 * room object is the one copy of the number; the rows that stand for topics we
 * do not hold keep their own. Either way nothing else reads or writes it.
 */
function rowPriority(row) {
  const r = row.room && state.rooms[row.room];
  return (r ? r.priority : row.priority) || 'none';
}

function setRowPriority(row, value) {
  const r = row.room && state.rooms[row.room];
  if (r) r.priority = value; else row.priority = value;
}

function findListRow(list, id) {
  return (list === 'topics' ? state.topicsList : state.dmsList).find((r) => r.id === id) || null;
}

/* ── filters ─────────────────────────────────────────────────────────────── */
/*
 * Every filter is a fact about a row, so a screen states which facts it offers
 * and the same three lines apply them. A pill nothing can answer would be a
 * pill that does nothing, which is what these used to be.
 */
const FILTERS = {
  'my-threads': [
    { label: 'Open',           test: (row) => row.status === 'open' },
    { label: 'Tagged in',      test: (row) => row.taggedIn },
    { label: 'Assigned to me', test: (row) => row.owner === ME },
    { label: 'Unread',         test: (row) => row.unread > 0 },
  ],
  topics: [
    { label: 'Unread',         test: (row) => row.unread > 0 },
    { label: 'Assigned to me', test: (row) => row.owner === ME },
  ],
  dms: [
    { label: 'Unread',         test: (row) => row.unread > 0 },
  ],
  'follow-ups': [
    { label: 'Open',    test: (row) => !row.done },
    { label: 'Unread',  test: (row) => row.unread > 0 },
    { label: 'Overdue', test: (row) => row.overdue },
  ],
  teams: [
    { label: 'My teams', test: (row) => row.mine },
  ],
};

function filterState(view) {
  if (!state.filters[view]) state.filters[view] = { search: '', on: [] };
  return state.filters[view];
}

function applyFilters(view, rows, text) {
  const f = filterState(view);
  const needle = f.search.trim().toLowerCase();
  return rows.filter((row) => {
    if (needle && !text(row).toLowerCase().includes(needle)) return false;
    return FILTERS[view].every((filter) => !f.on.includes(filter.label) || filter.test(row));
  });
}

/* A stream is a room's message list or a thread's; both are drawn the same. */
function streamOf(key) {
  if (state.rooms[key]) return state.rooms[key].messages;
  if (state.threads[key]) return state.threads[key].messages;
  return [];
}

function findMessage(streamKey, id) {
  return streamOf(streamKey).find((m) => m.id === id) || null;
}

function replyLabel(threadId) {
  const n = state.threads[threadId].messages.length;
  return n === 1 ? '1 reply' : `${n} replies`;
}

function reactionChip(msg, stream, place, reaction, index) {
  const cls = reaction.mine ? 'chipMine' : 'chip';
  const face = reaction.emoji
    ? `<span class="chipEmoji">${reaction.emoji}</span>`
    : `<span class="chipMark" data-reaction="${reaction.key}">${icon('reaction-' + reaction.key, 'compact')}</span>`;
  return `<button class="${cls}" type="button" data-act="toggle-reaction" data-stream="${stream}" data-msg="${msg.id}" data-place="${place}" data-index="${index}">${face}${reaction.count}</button>`;
}

/*
 * `place` is which of the two columns this copy of the message is being drawn
 * in. A thread's opening message appears in the room *and* at the top of the
 * panel — same id, same stream — so without it, opening a menu on one opens
 * the identical menu on the other.
 */
function messageHtml(msg, stream, place, asParent) {
  const person = PEOPLE[msg.author];
  const status = msg.status;
  const statusMeta = STATUSES.find((s) => s.key === status) || STATUSES[0];

  const marks = [];
  /* Open earns no badge — the ring in the corner bar already says so. The two
     finished states do, because a badge is also how you take one back. */
  if (status && status !== 'open') {
    marks.push(`<button class="statusChip" type="button" data-status="${status}" data-act="reset-status" data-stream="${stream}" data-msg="${msg.id}" data-place="${place}">${icon(statusMeta.icon, 'compact')}${statusMeta.label}</button>`);
  }
  if (msg.assignee) {
    marks.push(`<button class="assignChip" type="button" data-act="menu" data-menu="assignee" data-stream="${stream}" data-msg="${msg.id}" data-place="${place}" title="Assignee">${markFor(msg.assignee, 'small')}${esc(PEOPLE[msg.assignee].name)}</button>`);
  }
  if (msg.followUp) {
    const kind = FOLLOW_UP_KINDS.find((k) => k.key === msg.followUp.kind) || FOLLOW_UP_KINDS[0];
    marks.push(`<button class="followChip" type="button"${kind.agentic ? ' data-agentic' : ''} data-act="clear-follow-up" data-stream="${stream}" data-msg="${msg.id}" data-place="${place}" title="Clear this follow-up">${icon(kind.icon, 'compact')}${esc(msg.followUp.when)}</button>`);
  }
  msg.reactions.forEach((r, i) => marks.push(reactionChip(msg, stream, place, r, i)));

  const threadRow = msg.thread && !asParent
    ? `<div class="threadRow"><button class="replies" type="button" data-act="open-thread" data-thread="${msg.thread.id}">${replyLabel(msg.thread.id)}</button></div>`
    : '';

  const m = state.menu;
  const menuOpen = Boolean(m && m.msgId === msg.id && m.stream === stream && m.place === place);
  const tool = (kind, glyph, title, extra = '') =>
    `<button class="tool" type="button" ${extra} data-act="menu" data-menu="${kind}" data-stream="${stream}" data-msg="${msg.id}" data-place="${place}" aria-expanded="${menuOpen && m.kind === kind}" title="${title}">${glyph}</button>`;

  return `
  <li class="msg" data-msg="${msg.id}"${menuOpen ? ' data-busy' : ''}>
    ${markFor(msg.author, 'large')}
    <div class="msgBody">
      <div class="byline"><span class="author">${esc(person.name)}</span><span class="time">${esc(msg.time)}</span></div>
      <div class="text">${msg.spans.map(spanHtml).join('')}</div>
      ${marks.length ? `<div class="marks">${marks.join('')}</div>` : ''}
      ${threadRow}
    </div>
    <div class="tools">
      ${tool('status', icon(statusMeta.icon), 'Status', `data-status="${status || 'open'}"`)}
      ${tool('assignee', markFor(msg.assignee || ME, 'small'), 'Assignee')}
      <button class="tool" type="button" data-act="noop" title="Tag">${icon('tag')}</button>
      <span class="toolDivider"></span>
      ${tool('reaction', icon('emoji'), 'React')}
      <button class="tool" type="button" data-act="follow-up" data-stream="${stream}" data-msg="${msg.id}" data-place="${place}" title="Set a follow-up">${icon('timer')}</button>
      <button class="tool" type="button" data-act="noop" title="More">${icon('ellipsis')}</button>
      ${menuOpen ? menuHtml(m, msg, stream, place) : ''}
    </div>
  </li>`;
}

function menuHtml(menu, msg, stream, place) {
  const row = (kindAttr, value, glyph, label, on) => `
    <button class="menuItem" type="button" data-act="set-${menu.kind}" data-stream="${stream}" data-msg="${msg.id}" data-place="${place}" data-value="${value}"${on ? ' data-on' : ''}>
      <span class="menuMark" ${kindAttr}>${glyph}</span>
      <span class="menuLabel">${label}</span>
      ${on ? `<span class="menuCheck">${icon('check', 'compact')}</span>` : ''}
    </button>`;

  if (menu.kind === 'status') {
    const current = msg.status || 'open';
    return `<div class="menu" style="top:calc(100% + 4px);left:0" data-menu-body>${
      STATUSES.map((s) => row(`data-status="${s.key}"`, s.key, icon(s.icon), s.label, s.key === current)).join('')
    }</div>`;
  }
  if (menu.kind === 'assignee') {
    const current = msg.assignee || null;
    const people = ['m_yariv', 'm_david', 'm_elena', 'm_sarah', 'm_priya', 'm_marco', 'm_tom'];
    return `<div class="menu" style="top:calc(100% + 4px);left:0" data-menu-body>${
      people.map((id) => `
        <button class="menuItem" type="button" data-act="set-assignee" data-stream="${stream}" data-msg="${msg.id}" data-place="${place}" data-value="${id}"${id === current ? ' data-on' : ''}>
          <span class="menuMark">${markFor(id, 'small')}</span>
          <span class="menuLabel">${esc(PEOPLE[id].name)}</span>
          ${id === current ? `<span class="menuCheck">${icon('check', 'compact')}</span>` : ''}
        </button>`).join('')
    }</div>`;
  }
  if (menu.kind === 'reaction') {
    return `<div class="menu reactionMenu" style="top:calc(100% + 4px);right:0" data-menu-body>${
      REACTIONS.map((r) => `
        <button class="reactionOpt" type="button" data-reaction="${r.key}" data-act="add-reaction" data-stream="${stream}" data-msg="${msg.id}" data-place="${place}" data-value="${r.key}" title="${r.label}">${icon('reaction-' + r.key)}</button>`).join('')
    }</div>`;
  }
  return '';
}

function streamHtml(streamKey, place, filterOpen) {
  const list = streamOf(streamKey);
  const out = [];
  let day = null;
  let hidden = 0;
  list.forEach((msg) => {
    /* The filter is about what is still live, so it only ever hides a message
       somebody has finished with. */
    if (filterOpen && msg.status && msg.status !== 'open') { hidden += 1; return; }
    if (msg.day !== day) {
      day = msg.day;
      out.push(`<li class="divider"><span class="dividerLabel">${esc(day)}</span></li>`);
    }
    out.push(messageHtml(msg, streamKey, place, false));
  });
  if (hidden) {
    out.push(`<li class="filteredNote">${icon('filter', 'compact')} ${hidden === 1 ? '1 finished thread hidden' : `${hidden} finished threads hidden`}</li>`);
  }
  return out.join('');
}

function composerHtml(stream, placeholder, withProperties, size) {
  return `
  <form class="composer"${size ? ` data-size="${size}"` : ''} data-composer="${stream}">
    <button class="attach" type="button" data-act="noop" title="Attach files">${icon('attach')}</button>
    <div class="editor" contenteditable="true" role="textbox" aria-label="${esc(placeholder)}"
         data-empty="true" data-placeholder="${esc(placeholder)}" data-editor="${stream}"></div>
    ${withProperties ? `<div class="properties">
      <button class="propBtn" type="button" data-act="noop" title="Assignee: Yariv Ashkenazy">${markFor(ME, 'small')}</button>
      <button class="propBtn" type="button" data-act="noop" title="Tag">${icon('tag')}</button>
    </div>` : '<span></span>'}
    <button class="send" type="submit" data-send="${stream}" title="Send" disabled>${icon('send')}</button>
  </form>`;
}

function emptyHtml(label) {

function groupHtml(key, label, glyph, priorityKey, rows, drawRow) {
  if (!rows.length) return '';
  const isOpen = state.open[key] !== false;
  return `
  <section class="group">
    <button class="groupHead" type="button" data-act="toggle-group" data-value="${key}" aria-expanded="${isOpen}">
      <span class="groupChevron">${icon('chevron-down', 'compact')}</span>

      <span class="groupLabel">${esc(label)}</span>
      <span class="groupCount">${rows.length}</span>
    </button>
    ${isOpen ? `<div class="groupRows">${rows.map(drawRow).join('')}</div>` : ''}
  </section>`;
}

/* My Threads is every thread we hold plus the rows that stand for the rest. */
function allThreadRows() {
  const held = Object.values(state.threads).map((th) => {
    const r = state.rooms[th.room];
    const parent = r.messages.find((m) => m.id === th.parent);
    const last = th.messages[th.messages.length - 1];
    return {
      id: th.id,
      title: th.label,
      preview: last ? `${PEOPLE[last.author].name}: ${last.spans.map((sp) => sp.text || '').join('')}` : '',
      /* A thread has no priority of its own: it is as urgent as the room it is in. */
      priority: r.priority,
      status: (parent && parent.status) || 'open',
      type: r.kind === 'dm' ? 'general' : r.type,
      owner: parent ? (parent.assignee || parent.author) : ME,
      taggedIn: th.messages.concat(parent ? [parent] : []).some((m) => m.spans.some((sp) => sp.mention === ME)),
      unread: 0, activity: '2d', room: th.room, thread: th.id,
    };
  });
  return held.concat(state.extraThreads.map((row) => Object.assign({ status: 'open', taggedIn: false }, row)));
}

function myThreadsHtml() {
  const rows = applyFilters('my-threads', allThreadRows(), (row) => `${row.title} ${row.preview}`);
  const groups = PRIORITIES.map((p) => groupHtml(
    `mt-${p.key}`,
    p.key === 'none' ? 'No priority' : p.label,
    icon(p.icon), p.key,
    rows.filter((row) => (row.priority || 'none') === p.key),
    threadRowHtml,
  )).join('');
  return `
  ${headerHtml('My Threads', 'my-threads', 'my-threads')}
  <div class="listScroll">${groups || emptyHtml('No threads match these filters.')}</div>`;
}

function agentHtml() {

function turnHtml(turn) {
  if (turn.role === 'you') {
    return `<li class="turnYou">${esc(turn.text)}</li>`;
  }
  const running = turn.state === 'running';
  const stepsOpen = Boolean(turn.stepsOpen);
  return `
  <li class="turnAgent">

      ? `<p class="activity" aria-live="polite"><span class="pulse" aria-hidden="true"></span>${esc(turn.activity)}</p>`
      : `<button class="summary" type="button" data-act="toggle-steps" data-value="${turn.id}" aria-expanded="${stepsOpen}">${esc(turn.workLabel)}<span class="turnChevron">${icon('chevron-right', 'compact')}</span></button>`}

    ${turn.blocks ? `<div class="answer">${turn.blocks.map(blockHtml).join('')}</div>` : ''}
  </li>`;
}

function stepHtml(step) {
  return `
  <li class="step">
    ${step.title ? `<span class="stepHeadPlain">${esc(step.title)}</span>` : ''}
    ${step.reasoning ? `<p class="reasoning">${esc(step.reasoning)}</p>` : ''}

}

function blockHtml(block) {
  if (block.kind === 'bullets') {
    return `<ul class="bullets">${block.items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>`;
  }
  return `<p class="paragraph">${esc(block.text)}</p>`;
}

/*
 * What is half-typed is not state.
 *
 * The composer's text lives in the DOM, the way it does in the product, so a
 * re-render for something else — a menu opening, a status changing — has to
 * hand it back or it would eat a sentence somebody was in the middle of.
 */
function captureDrafts() {
  const drafts = {};
  app.querySelectorAll('[data-editor]').forEach((el) => { drafts[el.dataset.editor] = el.innerText; });
  return drafts;
}

function restoreDrafts(drafts) {
  app.querySelectorAll('[data-editor]').forEach((el) => {
    const text = drafts[el.dataset.editor];
    if (text && text.trim()) el.innerText = text;
    syncEditor(el);
  });
}

/* Where each stream was scrolled to, so a re-render does not jump the room. */
const scrollTops = {};
let scrollTarget = null;

function restoreScroll() {
  app.querySelectorAll('[data-scroll]').forEach((el) => {
    const key = el.dataset.scroll;
    if (scrollTarget === key) { el.scrollTop = el.scrollHeight; scrollTops[key] = el.scrollTop; }
    else if (scrollTops[key] != null) el.scrollTop = scrollTops[key];
    /* A room opens where it was left off — at the newest thing said. A thread
       opens at the message it is about, which is the top of it. */
    else el.scrollTop = state.rooms[key] || key === 'agent' ? el.scrollHeight : 0;
    el.addEventListener('scroll', () => { scrollTops[key] = el.scrollTop; }, { passive: true });
  });
  scrollTarget = null;
}
