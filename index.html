<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fosbury</title>
<meta name="description" content="Fosbury">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 150'%3E%3Cg fill='none' stroke='%23201C18' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M79 27 C75 15 61 10 53 18 C46 25 45 36 45 48 C45 72 43 93 41 110 C39 126 33 139 22 137 C12 135 11 121 26 112 C43 102 66 93 86 80'/%3E%3Cpath d='M6 108 H104'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --paper:#F3EEE5;
    --ink:#201C18;
    --muted:#7C7266;
    --line:#D6CCBB;
    --display:"Archivo",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --gut:clamp(20px,5vw,56px);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  svg{display:block}

  .page{
    height:100dvh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:clamp(20px,3.4vh,34px) var(--gut);
    gap:clamp(12px,2.2vh,26px);
  }

  /* --- top --- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .mark{height:clamp(24px,3.2vh,30px);width:auto;color:var(--ink)}
  .meta{
    margin:0;
    font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  }

  /* --- stage --- */
  .stage{
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(18px,3.6vh,42px);
  }
  .signature{
    height:clamp(150px,40vh,330px);
    width:auto;
    max-width:100%;
    color:var(--ink);
    overflow:visible;
  }
  .wordmark{
    font-family:var(--display);
    font-variation-settings:"wdth" 112;
    font-weight:650;
    letter-spacing:-.04em;
    font-size:clamp(30px,5.4vw,64px);
    line-height:1;
    margin:0;
    white-space:nowrap;
    opacity:0;
    transform:translateY(10px);
    animation:rise .9s 1.9s cubic-bezier(.2,.7,.2,1) forwards;
  }

  /* --- bottom --- */
  .bottom{
    border-top:1px solid var(--line);
    padding-top:clamp(12px,1.8vh,18px);
    display:flex;align-items:center;
    font-size:12px;color:var(--muted);
    opacity:0;
    animation:rise .9s 2.05s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @media(max-width:560px){.bottom{font-size:11px}}

  :focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:2px}

  /* --- motion: it writes itself, crossbar last --- */
  #script{
    stroke-dasharray:100;stroke-dashoffset:100;
    animation:draw 1.35s .25s cubic-bezier(.55,.05,.35,1) forwards;
  }
  #crossbar{
    stroke-dasharray:100;stroke-dashoffset:100;
    animation:draw .5s 1.6s cubic-bezier(.3,0,.15,1) forwards;
  }
  .top{opacity:0;animation:rise .9s 1.85s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){
    #script,#crossbar,.top,.bottom,.wordmark{
      animation:none;stroke-dashoffset:0;opacity:1;transform:none;
    }
  }
</style>
</head>
<body>

<div class="page">

  <header class="top">
    <svg class="mark" viewBox="0 0 110 150" role="img" aria-label="Fosbury">
      <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M79 27 C75 15 61 10 53 18 C46 25 45 36 45 48 C45 72 43 93 41 110 C39 126 33 139 22 137 C12 135 11 121 26 112 C43 102 66 93 86 80"/>
        <path d="M6 108 H104"/>
      </g>
    </svg>
    <p class="meta">Coming soon</p>
  </header>

  <div class="stage">
    <svg class="signature" viewBox="0 0 110 150" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
        <path id="script" pathLength="100"
              d="M79 27 C75 15 61 10 53 18 C46 25 45 36 45 48 C45 72 43 93 41 110 C39 126 33 139 22 137 C12 135 11 121 26 112 C43 102 66 93 86 80"/>
        <path id="crossbar" pathLength="100" d="M6 108 H104"/>
      </g>
    </svg>
    <h1 class="wordmark">Fosbury</h1>
  </div>

  <footer class="bottom">
    <span>© 2027 Fosbury</span>
  </footer>

</div>

</body>
</html>
